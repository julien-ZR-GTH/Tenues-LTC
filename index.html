/* ---------- navigation ---------- */
const TABS = [["synthese","Synthèse"],["commandes","Commandes tenues"],["boutique","Boutique"],["a-commander","À commander"],["dashboard","Dashboard"],["import","Import Google"]];
function go(view, reset){
  if (!S.m) view = "accueil";
  if (reset) S.back = [];
  else if (view !== S.view && S.view !== "accueil") S.back.push({ view: S.view, sel: S.sel });
  if (S.back.length > 30) S.back.shift();
  S.view = view; S.armedDelete = false;
  if (view !== "fiche") $("#q").value = "";
  try { history.replaceState(null, "", "#" + view); } catch(_){}
  render(); window.scrollTo({ top: 0 });
}
function goBack(){
  const prev = S.back.pop();
  if (!prev){ S.view = "synthese"; } else { S.view = prev.view; S.sel = prev.sel; }
  if (S.view === "fiche" && !person(S.sel)) S.view = "commandes";
  S.armedDelete = false; if (S.view !== "fiche") $("#q").value = "";
  try { history.replaceState(null, "", "#" + S.view); } catch(_){}
  render(); window.scrollTo({ top: 0 });
}
function goTab(view){ S.back = []; S.view = view; S.armedDelete = false; $("#q").value = ""; try { history.replaceState(null, "", "#" + view); } catch(_){} render(); window.scrollTo({ top:0 }); }
function openPerson(uid){ if (!person(uid)) return; S.pay = null; S.armedTx = null; if (S.view === "fiche" && S.sel === uid) return; if (S.view !== "accueil") S.back.push({ view:S.view, sel:S.sel }); S.sel = uid; S.view = "fiche"; S.armedDelete = false; try { history.replaceState(null, "", "#fiche"); } catch(_){} render(); window.scrollTo({ top:0 }); }
$("#homeLogo").addEventListener("click", () => S.m && goTab("synthese"));

function renderHeaderState(){
  const has = !!S.m;
  $("#q").disabled = !has; $("#newBtn").disabled = !has; $("#exportBtn").disabled = !has;
  $("#exportDot").hidden = !(has && S.m.dirty);
}
function renderNav(){
  const nb = $("#navbar");
  if (!S.m){ nb.innerHTML = ""; return; }
  const m = S.m;
  const state = m.dirty ? `<span class="unsaved">● Modifications non exportées</span>` : (m.modifiedAt ? `<span class="saved">✓ Exporté</span>` : "");
  const src = `<div class="source">Fichier : <b>${esc(m.source)}</b> · ${plural(m.people.length,"commande")} ${state}</div>`;
  if (S.view === "fiche"){
    const p = person(S.sel); const prev = S.back[S.back.length-1];
    const prevLabel = prev ? (prev.view === "fiche" ? (person(prev.sel)?.name ? title(person(prev.sel).name) : "Fiche") : (TABS.find(t=>t[0]===prev.view)||[,"Synthèse"])[1]) : "Synthèse";
    nb.innerHTML = `<div class="crumbs"><button class="btn" id="backBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Retour</button><span class="path">${esc(prevLabel)} › <b>${esc(p ? title(p.name) || "Sans nom" : "")}</b></span></div>${src}`;
    $("#backBtn").onclick = goBack;
  } else {
    const pend = S.stage.rows.length;
    nb.innerHTML = `<nav class="tabs" aria-label="Vues">${TABS.map(([k,l]) => `<button type="button" data-tab="${k}" ${S.view===k?'aria-current="page"':""}>${l}${k==="import" && pend ? ` <span class="pendcount">${pend}</span>` : ""}</button>`).join("")}</nav>${src}`;
    nb.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => goTab(b.dataset.tab));
  }
}
function render(){
  renderHeaderState(); renderNav();
  const v = $("#view");
  if (!S.m || S.view === "accueil") return renderBlank(v);
  ({ synthese:renderSynthese, commandes:renderCommandes, "a-commander":renderOrder, dashboard:renderDashboard, fiche:renderFiche, import:renderImport, boutique:renderBoutique }[S.view] || renderSynthese)(v);
}

/* ---------- view: blank ---------- */
function renderBlank(v){
  const saved = readSaved();
  v.innerHTML = `<div class="blank">
    <div class="logo"><img src="${$("#homeLogo img").src}" alt="Laval Triathlon Club"></div>
    <h2>Aucune donnée chargée</h2>
    <p>Chargez votre fichier Excel de suivi des commandes pour voir qui a payé quoi, saisir les commandes et les tailles, puis exporter le fichier à jour.</p>
    <div class="row"><button class="btn primary" type="button" id="bLoad">Charger les données</button><button class="btn" type="button" id="bEmpty">Démarrer un fichier vide</button></div>
    ${saved ? `<div class="resume"><span>Travail en cours trouvé sur ce navigateur : <b>${esc(saved.source)}</b>, ${plural(saved.people.length,"commande")}${saved.dirty ? ", <b>non exporté</b>" : ""}${saved.modifiedAt ? " · modifié le " + new Date(saved.modifiedAt).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}) : ""}</span><button class="btn dark" type="button" id="bResume">Reprendre</button><button class="linkbtn" type="button" id="bForget">Effacer</button></div>` : ""}
    <p class="sub">Les données restent sur cet ordinateur : rien n'est envoyé ailleurs. Pensez à exporter pour garder vos modifications dans le fichier Excel.</p>
  </div>`;
  $("#bLoad").onclick = pickFile;
  $("#bEmpty").onclick = () => { blankModel(); persist(); go("commandes", true); };
  if (saved){
    $("#bResume").onclick = () => { S.m = migrate(saved); persist(); go("synthese", true); };
    $("#bForget").onclick = () => { try { localStorage.removeItem(STORE_KEY); } catch(_){} render(); };
  }
}

/* ---------- view: synthèse ---------- */
function chipList(arr){ return arr.length ? `<div class="chips">${arr.map(p=>`<button class="chip" type="button" data-open="${p.uid}">${esc(title(p.name))}</button>`).join("")}</div>` : `<span class="sub">Rien à signaler.</span>`; }
function renderSynthese(v){
  const people = S.m.people, a = agg(people);
  const pct = a.total ? Math.round(a.paid / a.total * 100) : 0, w = x => a.total ? x / a.total * 100 : 0;
  const unpaid = people.filter(p => { const s = calc(p).sc.cmd; return s.q > 0 && s.st !== "paid"; });
  const shopUnpaid = people.filter(p => { const s = calc(p).sc.day; return s.q > 0 && s.st !== "paid"; });
  const scopeAgg = k => { const r = { total:0, paid:0, q:0, pq:0, n:{ paid:0, partial:0, unpaid:0, unknown:0 } }; people.forEach(p => { const s = calc(p).sc[k]; if (!s.q) return; r.total += s.total; r.paid += s.paid; r.q += s.q; r.pq += s.pq; r.n[s.st]++; }); return r; };
  const scopeCard = k => { const s = scopeAgg(k), pc = s.total ? Math.round(s.paid / s.total * 100) : 0; return `<div class="panel scopecard">
      <div class="row"><h3>${SCOPES[k].label}</h3><span class="sub">${SCOPES[k].hint}</span></div>
      <div class="row"><span><span class="big" style="color:var(--good)">${fmtEur(s.paid)}</span> <span class="sub">encaissés sur ${fmtEur(s.total)}</span></span><b style="color:var(--bad)">reste ${fmtEur(s.total - s.paid)}</b></div>
      <div class="track" aria-hidden="true"><span style="width:${pc}%;background:var(--good)"></span></div>
      <div class="row"><span class="sub">${k === "cmd" ? "" : `${plural(s.n.paid + s.n.partial + s.n.unpaid + s.n.unknown, "client")} · `}</span>${k === "day" ? `<span class="row" style="gap:8px"><button type="button" class="btn sm" data-gotab="boutique">Voir la boutique</button><button type="button" class="btn primary sm" data-shop>+ Vente boutique</button></span>` : `<button type="button" class="btn sm" data-gotab="commandes">Voir les commandes tenues</button>`}</div>
      ${k === "day" && shopUnpaid.length ? `<span class="sub">Boutique à encaisser :</span><div class="chips">${shopUnpaid.map(p=>`<button class="chip" type="button" data-open="${p.uid}">${esc(title(p.name))} · ${fmtEur(calc(p).sc.day.total - calc(p).sc.day.paid)}</button>`).join("")}</div>` : ""}
      <div class="badges"><span class="badge paid">${s.n.paid} réglé${s.n.paid>1?"s":""}</span><span class="badge partial">${s.n.partial} partiel${s.n.partial>1?"s":""}</span><span class="badge unpaid">${s.n.unpaid} non réglé${s.n.unpaid>1?"s":""}</span>${s.n.unknown ? `<span class="badge unknown">${s.n.unknown} non renseigné${s.n.unknown>1?"s":""}</span>` : ""}<span class="sub">${s.pq} / ${plural(s.q,"pièce")} payée${s.q>1?"s":""}</span></div>
    </div>`; };
  const noted = people.filter(p => p.note);
  const conflicts = people.filter(p => p.conflict);
  const youngTri = people.filter(p => norm(p.cat) === "jeune" && calc(p).famQ.tri > 0);
  const sizeTodo = people.filter(p => S.m.articles.some(x => x.fam !== "autre" && !noSize(x.name) && (p.sizes[x.col] || []).some(s => !s)));
  const fam = FAM_ORDER.map(f => { const st = articleStats(people, f); const q = st.reduce((s,x)=>s+x.q,0), pd = st.reduce((s,x)=>s+x.paid,0), amt = st.reduce((s,x)=>s+x.amt,0); return { f, st, q, pd, amt }; });
  const famCard = ({ f, st, q, pd, amt }) => {
    let extra = "";
    if (f === "tri"){ const c = st.filter(x=>/courte/.test(norm(x.name))).reduce((s,x)=>s+x.q,0), l = st.filter(x=>/longue/.test(norm(x.name))).reduce((s,x)=>s+x.q,0); extra = `<div class="duo"><div><span class="sub">Courte distance</span><b>${c}</b></div><div><span class="sub">Longue distance</span><b>${l}</b></div></div>`; }
    return `<div class="panel famcard ${f}">
      <div class="row"><h3>${FAMS[f].label}</h3><span class="sub">${fmtEur(amt)}</span></div>
      <div class="row"><span class="big">${q}</span><span class="split"><span class="badge paid">${pd} réglé${pd>1?"s":""}</span><span class="badge unpaid">${q-pd} à encaisser</span></span></div>
      ${extra}
      <div class="artlist">${st.filter(x=>x.q).sort((x,y)=>y.q-x.q).map(x=>`<div class="ar"><span>${esc(x.name)}</span><span class="mini"><b>${x.q}</b> <span class="sub">(</span><span class="g">${x.paid}</span><span class="sub">/</span><span class="b">${x.q-x.paid}</span><span class="sub">)</span></span></div>`).join("") || `<span class="sub">Aucun article commandé.</span>`}</div>
    </div>`;
  };
  const active = people.filter(hasCmd);
  const nPrep = active.filter(p => p.prep).length, nRet = active.filter(p => p.ret).length, waiting = active.filter(p => p.prep && !p.ret).sort((a,b)=>refNum(a.ref)-refNum(b.ref));
  const wp = x => active.length ? x / active.length * 100 : 0;
  v.innerHTML = `
    <div class="tablehead"><div><h2>Synthèse</h2><span class="sub">Paiements, familles d'articles et préparation des sacs.</span></div>${SUP_BTN}</div>
    <div class="kpis">
      <div class="kpi good"><span class="lbl">Encaissé</span><span class="val">${fmtEur(a.paid)}</span><span class="sub">${plural(a.nPaid,"adhérent")} à jour${a.nPartial ? ` · ${a.nPartial} partiel${a.nPartial>1?"s":""}` : ""}</span></div>
      <div class="kpi bad"><span class="lbl">Reste à encaisser</span><span class="val">${fmtEur(a.unpaid + a.unknown)}</span><span class="sub">${plural(a.nUnpaid + a.nUnknown + a.nPartial,"adhérent")} avec un reste dû</span></div>
      <div class="kpi"><span class="lbl">Total commandé</span><span class="val">${fmtEur(a.total)}</span><span class="sub">${plural(a.n,"adhérent")}</span></div>
      <div class="kpi"><span class="lbl">Articles commandés</span><span class="val">${fmtInt(a.qty)}</span><span class="sub">${fam.map(x=>x.q+" "+({tri:"trifonctions",velo:"vélo",autre:"boutique"})[x.f]).join(" · ")}</span></div>
    </div>
    <div class="panel">
      <div class="row"><strong>${pct} % du montant commandé est encaissé</strong><span class="sub">${fmtEur(a.paid)} sur ${fmtEur(a.total)}</span></div>
      <div class="track" aria-hidden="true"><span style="width:${w(a.paid)}%;background:var(--good)"></span><span style="width:${w(a.unpaid)}%;background:var(--bad)"></span><span style="width:${w(a.unknown)}%;background:var(--none)"></span></div>
      <div class="badges"><span class="badge paid">Encaissé · ${fmtEur(a.paid)}</span><span class="badge unpaid">Reste dû · ${fmtEur(a.unpaid)}</span><span class="badge unknown">Non renseigné · ${fmtEur(a.unknown)}</span></div>
    </div>
    <div class="scopes">${scopeCard("cmd")}${scopeCard("day")}</div>
    <div class="panel">
      <div class="row"><h3>Préparation des sacs <span class="sub" style="font-family:var(--font-body)">· commandes tenues uniquement</span></h3><span class="badges"><span class="badge prepd">${nPrep} préparé${nPrep>1?"s":""}</span><span class="badge ret">✓ ${nRet} retiré${nRet>1?"s":""}</span><span class="badge todo">${active.length - nPrep} à préparer</span></span></div>
      <div class="track" aria-hidden="true"><span style="width:${wp(nRet)}%;background:var(--good)"></span><span style="width:${wp(nPrep - nRet)}%;background:var(--accent)"></span></div>
      <span class="sub">Sacs prêts, en attente de retrait :</span>
      ${waiting.length ? `<div class="chips">${waiting.map(p=>`<button class="chip" type="button" data-open="${p.uid}"><b>${esc(p.ref)}</b> · ${esc(title(p.name))}</button>`).join("")}</div>` : `<span class="sub">Aucun pour l'instant.</span>`}
    </div>
    <div><h2>Par famille d'articles</h2><span class="sub">Trifonctions et vélo : commandés. Boutique : vendus. Entre parenthèses : <span style="color:var(--good);font-weight:700">réglées</span> / <span style="color:var(--bad);font-weight:700">à encaisser</span>.</span></div>
    <div class="grid3">${fam.map(famCard).join("")}</div>
    <h2>Points d'attention</h2>
    <div class="attn">
      <div class="panel"><h3>À relancer <span class="count">${unpaid.length}</span></h3><span class="sub">Commande tenues non réglée ou partielle</span>${chipList(unpaid)}</div>
      <div class="panel"><h3>Trifonctions jeunes <span class="count">${youngTri.reduce((s,p)=>s+calc(p).famQ.tri,0)}</span></h3><span class="sub">À voir avec Fanny (caution)</span>${chipList(youngTri)}</div>
      <div class="panel"><h3>Tailles à préciser <span class="count">${sizeTodo.length}</span></h3><span class="sub">Adhérents avec au moins une taille manquante</span>${chipList(sizeTodo)}</div>
      <div class="panel" ${conflicts.length ? 'style="border:2px solid var(--bad)"' : ""}><h3>Conflits à revérifier <span class="count" style="color:var(--bad)">${conflicts.length}</span></h3><span class="sub">Fiches cochées « Conflit, à revérifier »</span>${conflicts.length ? chipList(conflicts) : `<span class="sub">Aucune fiche cochée.</span>`}</div>
    </div>
    <div class="panel"><h3>Avec une note <span class="count" style="font-family:var(--font-display);color:var(--accent-ink)">${noted.length}</span></h3>${chipList(noted)}</div>`;
  bindOpen(v);
  v.querySelectorAll("[data-gotab]").forEach(b => b.onclick = () => goTab(b.dataset.gotab));
}
function bindOpen(root){
  root.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => openPerson(+el.dataset.open));
    if (el.tagName === "TR") el.addEventListener("keydown", e => { if (e.key === "Enter") openPerson(+el.dataset.open); });
  });
}

/* ---------- view: commandes tenues ---------- */
const cmdSt = p => { const s = calc(p).sc.cmd.st; return s === "none" ? "unknown" : s; };
function renderCommandes(v){
  const people = S.m.people.filter(p => hasCmd(p) || calc(p).qty === 0);
  const counts = { all:people.length, paid:0, partial:0, unpaid:0, unknown:0 }; people.forEach(p => counts[cmdSt(p)]++);
  const cats = [...new Set(people.map(p=>p.cat || "Non renseignée"))];
  const prepOk = p => S.prepF === "all" || (S.prepF === "todo" && !p.prep) || (S.prepF === "ready" && p.prep && !p.ret) || (S.prepF === "done" && p.ret);
  const famF = S.fam === "autre" ? "all" : S.fam;
  let list = people.filter(p => (S.filter === "all" || cmdSt(p) === S.filter) && (S.cat === "all" || (p.cat || "Non renseignée") === S.cat) && (famF === "all" || calc(p).famQ[famF] > 0) && prepOk(p));
  const key = S.sort.key, dir = S.sort.dir;
  const val = (p, k) => { const c = calc(p); return k === "ref" ? (refNum(p.ref) || 1e6) : k === "total" ? c.sc.cmd.total : k === "status" ? ["paid","partial","unpaid","unknown"].indexOf(cmdSt(p)) : k === "tri" || k === "velo" ? c.famQ[k] : k === "mode" ? txModes(p).join(" + ") : k === "time" ? whenKey(lastTx(p)) : String(p[k] || ""); };
  list = list.slice().sort((x,y)=>{ const a = val(x,key), b = val(y,key); return (typeof a === "number" ? a - b : a.localeCompare(b,"fr")) * dir; });
  let tot = 0, paid = 0; const fq = { tri:0, velo:0 }; list.forEach(p => { const c = calc(p); tot += c.sc.cmd.total; paid += c.sc.cmd.paid; fq.tri += c.famQ.tri; fq.velo += c.famQ.velo; });
  const arrow = k => S.sort.key === k ? (S.sort.dir > 0 ? " ▲" : " ▼") : "";
  const cnt = (n, f) => `<span class="cnt ${n ? f : "zero"}">${n || "–"}</span>`;
  v.innerHTML = `
    <div class="tablehead">
      <div><h2>Commandes tenues</h2><span class="sub">Trifonctions et tenues vélo : commande fournisseur, tailles, sac et retrait. Cliquez sur une ligne pour ouvrir la fiche.</span></div>
      <button class="btn dark" type="button" id="newInline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nouvelle commande</button>
    </div>
    <div class="filters">
      ${["all","paid","partial","unpaid","unknown"].map(f=>`<button class="seg" type="button" data-filter="${f}" aria-pressed="${S.filter===f}">${f==="all"?"Tous":STATUS[f]} (${counts[f]})</button>`).join("")}
      <select id="catSel" class="seg" aria-label="Catégorie"><option value="all">Toutes catégories</option>${cats.map(c=>`<option ${S.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
      <select id="prepSel" class="seg" aria-label="Préparation"><option value="all">Préparation : toutes</option>${[["todo","À préparer"],["ready","Préparées, non retirées"],["done","Retirées"]].map(([k,l])=>`<option value="${k}" ${S.prepF===k?"selected":""}>${l}</option>`).join("")}</select>
      <select id="famSel" class="seg" aria-label="Famille"><option value="all">Trifonctions et vélo</option>${["tri","velo"].map(f=>`<option value="${f}" ${famF===f?"selected":""}>Avec ${FAMS[f].label.toLowerCase()}</option>`).join("")}</select>
    </div>
    <div class="tablebox clickrows"><table>
      <thead><tr>
        <th><button data-sort="name">Nom${arrow("name")}</button></th><th><button data-sort="cat">Catégorie${arrow("cat")}</button></th>
        <th class="c"><button data-sort="tri"><span class="fam tri"></span> Trifonctions${arrow("tri")}</button></th><th class="c"><button data-sort="velo"><span class="fam velo"></span> Vélo${arrow("velo")}</button></th>
        <th class="num"><button data-sort="total">Montant${arrow("total")}</button></th>
        <th><button data-sort="status">Payé ?${arrow("status")}</button></th><th><button data-sort="mode">Mode${arrow("mode")}</button></th>
        <th><button data-sort="time">Date / heure${arrow("time")}</button></th><th class="c">Note</th><th><button data-sort="ref">Sac${arrow("ref")}</button></th><th>Retrait</th>
      </tr></thead>
      <tbody>${list.map(p => { const c = calc(p), s = c.sc.cmd; return `<tr data-open="${p.uid}" tabindex="0">
        <td class="name">${p.conflict ? `<span title="Conflit à revérifier" style="color:var(--bad)">⚠ </span>` : ""}${esc(title(p.name)) || "<span class='sub'>Sans nom</span>"}${p.email ? `<br><span class="sub" style="font-weight:400">${esc(p.email)}</span>` : ""}${c.sc.day.q ? `<br><span class="sub" style="font-weight:400">+ boutique ${fmtEur(c.sc.day.total)}</span>` : ""}</td><td>${badgeCat(p.cat)}</td>
        <td class="c">${cnt(c.famQ.tri, "tri")}</td><td class="c">${cnt(c.famQ.velo, "velo")}</td>
        <td class="num"><strong>${fmtEur(s.total)}</strong>${s.paid && s.paid < s.total ? `<br><span class="sub">payé ${fmtEur(s.paid)}</span>` : ""}</td>
        <td>${badgeStatus(cmdSt(p))}</td>
        <td>${esc(txModes(p).join(" + ")) || "<span class='sub'>—</span>"}</td><td>${esc(txLast(p)) || "<span class='sub'>—</span>"}</td>
        <td class="c">${p.note ? `<span class="noteflag" title="${esc(p.note)}">!</span>` : ""}</td>
        <td>${p.ref ? `<span class="badge sac">${esc(p.ref)}</span>` : "<span class='sub'>—</span>"}</td>
        <td>${p.ret ? `<span class="badge ret" title="${esc(p.retNote)}">✓ Retirée</span>` : p.prep ? `<span class="badge prepd">Préparée</span>` : `<span class="badge todo">À préparer</span>`}</td></tr>`; }).join("") || `<tr><td colspan="11" class="sub">Aucune commande pour ces filtres.</td></tr>`}</tbody>
      <tfoot><tr><td>${plural(list.length,"adhérent")}</td><td></td><td class="c">${fq.tri}</td><td class="c">${fq.velo}</td><td class="num">${fmtEur(tot)}</td><td colspan="6">dont encaissé ${fmtEur(paid)} · ${list.filter(p=>p.ret).length} retirée(s)</td></tr></tfoot>
    </table></div>
    ${S.m.fileNotes.length ? `<div class="sub">${S.m.fileNotes.map(r=>`Remarque du fichier : ${esc(clean(r[0]))}`).join("<br>")}</div>` : ""}`;
  v.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { S.filter = b.dataset.filter; render(); });
  v.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { const k = b.dataset.sort; S.sort = { key:k, dir: S.sort.key === k ? -S.sort.dir : (["total","tri","velo"].includes(k) ? -1 : 1) }; render(); });
  $("#catSel").onchange = e => { S.cat = e.target.value; render(); };
  $("#famSel").onchange = e => { S.fam = e.target.value; render(); };
  $("#prepSel").onchange = e => { S.prepF = e.target.value; render(); };
  $("#newInline").onclick = openNew;
  bindOpen(v);
}

/* ---------- view: boutique ---------- */
function renderBoutique(v){
  const buyers = S.m.people.filter(p => calc(p).sc.day.q > 0);
  const st = articleStats(S.m.people, "autre");
  let tot = 0, paid = 0, n = { paid:0, partial:0, unpaid:0, unknown:0 }; buyers.forEach(p => { const s = calc(p).sc.day; tot += s.total; paid += s.paid; n[s.st]++; });
  const shopSt = p => calc(p).sc.day.st;
  const list = buyers.filter(p => S.shopF === "all" || (S.shopF === "paid" ? shopSt(p) === "paid" : shopSt(p) !== "paid")).sort((a,b) => a.name.localeCompare(b.name,"fr"));
  v.innerHTML = `
    <div class="tablehead"><div><h2>Boutique</h2><span class="sub">Goodies, maillot course à pied… vendus et remis sur place : pas de commande fournisseur, pas de sac, pas de retrait.</span></div>
      <button type="button" class="btn primary" data-shop><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Vente boutique</button></div>
    <div class="kpis">
      <div class="kpi good"><span class="lbl">Encaissé boutique</span><span class="val">${fmtEur(paid)}</span><span class="sub">${plural(n.paid,"client")} à jour</span></div>
      <div class="kpi bad"><span class="lbl">Reste à encaisser</span><span class="val">${fmtEur(tot - paid)}</span><span class="sub">${plural(n.partial + n.unpaid + n.unknown,"client")}</span></div>
      <div class="kpi"><span class="lbl">Ventes</span><span class="val">${fmtEur(tot)}</span><span class="sub">${plural(buyers.length,"client")}</span></div>
      <div class="kpi"><span class="lbl">Pièces vendues</span><span class="val">${fmtInt(st.reduce((s,x)=>s+x.q,0))}</span><span class="sub">${st.reduce((s,x)=>s+x.paid,0)} payées</span></div>
    </div>
    <div class="panel"><h3>Par article</h3>
      <div style="overflow-x:auto"><table style="min-width:520px"><thead><tr><th>Article</th><th class="num">Prix</th><th class="num">Vendus</th><th class="num">Payés</th><th class="num">À encaisser</th><th class="num">Montant</th></tr></thead>
      <tbody>${st.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="num">${x.price ? fmtEur(x.price) : "<span class='sub'>—</span>"}</td><td class="num"><b>${x.q || "–"}</b></td><td class="num" style="color:var(--good);font-weight:700">${x.q ? x.paid : ""}</td><td class="num" style="color:var(--bad);font-weight:700">${x.q ? x.q - x.paid : ""}</td><td class="num">${x.q ? fmtEur(x.amt) : ""}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="tablehead"><h3>Ventes par client</h3><div class="filters">${[["all","Toutes"],["paid","Réglées"],["due","À encaisser"]].map(([k,l])=>`<button class="seg" type="button" data-sf="${k}" aria-pressed="${S.shopF===k}">${l}</button>`).join("")}</div></div>
    <div class="tablebox clickrows"><table style="min-width:760px"><thead><tr><th>Client</th><th>Articles</th><th class="num">Montant</th><th>Payé ?</th><th>Mode</th><th>Date / heure</th></tr></thead>
      <tbody>${list.map(p => { const c = calc(p), s = c.sc.day, lt = lastDayTx(p); return `<tr data-open="${p.uid}" tabindex="0">
        <td class="name">${esc(title(p.name))}${hasCmd(p) ? `<br><span class="sub" style="font-weight:400">a aussi une commande tenues</span>` : ""}</td>
        <td><div class="sizechips">${c.items.filter(i => i.fam === "autre").map(i => `<span>${esc(i.name)}${i.q > 1 ? " ×" + i.q : ""}</span>`).join("")}</div></td>
        <td class="num"><strong>${fmtEur(s.total)}</strong>${s.paid && s.paid < s.total ? `<br><span class="sub">payé ${fmtEur(s.paid)}</span>` : ""}</td>
        <td>${badgeStatus(s.st)}</td><td>${lt && lt.mode ? esc(lt.mode) : "<span class='sub'>—</span>"}</td><td>${lt ? esc([lt.date, lt.time].filter(Boolean).join(" ")) || "<span class='sub'>—</span>" : "<span class='sub'>—</span>"}</td></tr>`; }).join("") || `<tr><td colspan="6" class="sub">Aucune vente pour ce filtre.</td></tr>`}</tbody>
    </table></div>`;
  v.querySelectorAll("[data-sf]").forEach(b => b.onclick = () => { S.shopF = b.dataset.sf; render(); });

/* ---------- vente boutique (fenêtre) ---------- */
function openShop(prefill){
  if (!S.m) return;
  S.shop = { name: prefill || "", qty:{}, paidNow:true, mode:"Carte bancaire" };
  $("#shopOverlay").hidden = false; renderShop(); setTimeout(() => $("#shopName")?.focus(), 0);
}
function closeShop(){ $("#shopOverlay").hidden = true; S.shop = null; }
function renderShop(){
  const f = S.shop, arts = S.m.articles.filter(a => a.fam === "autre");
  const total = arts.reduce((s,a) => s + (f.qty[a.col] || 0) * a.price, 0), n = arts.reduce((s,a) => s + (f.qty[a.col] || 0), 0);
  const hit = S.m.people.find(p => norm(p.name) === norm(f.name));
  $("#shopModal").innerHTML = `<h2 id="shopTitle">Vente boutique</h2>
    <div class="field"><label for="shopName">Client</label><input type="text" id="shopName" list="shopPeople" value="${esc(f.name)}" placeholder="Nom et prénom (adhérent existant ou nouveau)">
      <datalist id="shopPeople">${S.m.people.map(p => `<option value="${esc(p.name)}">`).join("")}</datalist>
      <span class="sub" id="shopHint">${f.name ? (hit ? "Adhérent existant : la vente s'ajoute à sa fiche." : "Nouveau client : une fiche sera créée.") : ""}</span></div>
    <div class="famsec">${arts.map(a => { const q = f.qty[a.col] || 0; return `<div class="artrow ${q?"on":""}"><div class="an"><b>${esc(a.name)}</b><span class="sub">${a.price ? fmtEur(a.price) : "prix non renseigné"}</span></div>
      <div class="stepper"><button type="button" id="sdec-${a.col}" data-sdec="${a.col}" ${q?"":"disabled"} aria-label="Retirer ${esc(a.name)}">−</button><span>${q}</span><button type="button" id="sinc-${a.col}" data-sinc="${a.col}" aria-label="Ajouter ${esc(a.name)}">+</button></div>
      <div class="st">${q ? fmtEur(q * a.price) : ""}</div></div>`; }).join("")}</div>
    <div class="field"><span class="lbl">Paiement</span><div class="segs">
      <button type="button" id="spay-o" class="paid" data-spay="1" aria-pressed="${f.paidNow}">Payé maintenant</button>
      <button type="button" id="spay-n" class="unpaid" data-spay="0" aria-pressed="${!f.paidNow}">À payer plus tard</button></div></div>
    ${f.paidNow ? `<div class="field"><label for="shopMode">Mode</label><select id="shopMode">${MODES.map(m => `<option ${f.mode===m?"selected":""}>${m}</option>`).join("")}</select></div>` : ""}
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="shopCancel">Annuler</button><button type="button" class="btn primary" id="shopSave" ${n && clean(f.name) ? "" : "disabled"}>Enregistrer la vente · ${fmtEur(total)}</button></div>`;
  const m = $("#shopModal");
  $("#shopName").oninput = e => { f.name = e.target.value; const h = S.m.people.find(p => norm(p.name) === norm(f.name)); $("#shopHint").textContent = f.name ? (h ? "Adhérent existant : la vente s'ajoute à sa fiche." : "Nouveau client : une fiche sera créée.") : ""; $("#shopSave").disabled = !(n && clean(f.name)); };
  m.querySelectorAll("[data-sinc]").forEach(b => b.onclick = () => { const c = +b.dataset.sinc; f.qty[c] = (f.qty[c] || 0) + 1; renderShop(); $("#sinc-" + c)?.focus(); });
  m.querySelectorAll("[data-sdec]").forEach(b => b.onclick = () => { const c = +b.dataset.sdec; f.qty[c] = Math.max(0, (f.qty[c] || 0) - 1); if (!f.qty[c]) delete f.qty[c]; renderShop(); $("#sdec-" + c)?.focus(); });
  m.querySelectorAll("[data-spay]").forEach(b => b.onclick = () => { f.paidNow = b.dataset.spay === "1"; renderShop(); });
  const ms = $("#shopMode"); if (ms) ms.onchange = e => f.mode = e.target.value;
  $("#shopCancel").onclick = closeShop;
  $("#shopSave").onclick = () => {
    const name = clean(f.name); if (!name || !Object.keys(f.qty).length) return;
    let p = S.m.people.find(x => norm(x.name) === norm(name)), created = false;
    if (!p){ p = { uid: S.m.nextUid++, name: title(name), cat:"", qty:{}, sizes:{}, paid:"Non", mode:"", time:"", note:"", form:"", cells:[], tx:[], prep:false, ref:"", ret:false, retDate:"", retNote:"", email:"", origin:"Boutique" }; S.m.people.push(p); created = true; }
    Object.entries(f.qty).forEach(([c, q]) => p.qty[c] = (p.qty[c] || 0) + q); fixSizes(p);
    const amount = Object.entries(f.qty).reduce((s,[c,q]) => s + q * (S.m.articles.find(a => a.col === +c)?.price || 0), 0);
    if (f.paidNow){
      S.m.nextTx = Math.max(S.m.nextTx || 1, 1 + Math.max(0, ...S.m.people.flatMap(x => (x.tx || []).map(t => t.id))));
      p.tx = p.tx || []; p.tx.push({ id: S.m.nextTx++, date: new Date().toLocaleDateString("fr-FR"), time: nowHM(), mode: f.mode, items: { ...f.qty }, amount, note:"Vente boutique" });
    }
    if (!p.paid) p.paid = "Non";
    closeShop(); touch(); render();
    showMsg(`Vente boutique enregistrée pour ${esc(title(p.name))} : ${fmtEur(amount)}${f.paidNow ? " payés" : " à encaisser"}${created ? " (nouvelle fiche)" : ""}.`, "ok");
  };
}
document.addEventListener("click", e => { if (e.target.closest("[data-shop]")) openShop(); });

/* ---------- view: dashboard ---------- */
function stackBars(rows){
  const max = Math.max(1, ...rows.map(r => r.q));
  return `<div class="bars">${rows.map(r=>`<div class="barrow"><span class="bl" title="${esc(r.name)}">${esc(r.name)}</span><span class="bt" title="${r.paid} réglés, ${r.unpaid} non réglés, ${r.unknown} non renseignés"><span style="width:${r.paid/max*100}%;background:var(--good)"></span><span style="width:${r.unpaid/max*100}%;background:var(--bad)"></span><span style="width:${r.unknown/max*100}%;background:var(--none)"></span></span><span class="bv">${r.q}</span></div>`).join("")}</div>`;
}
function simpleBars(rows, fmt, color){
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="bars">${rows.map(r=>`<div class="barrow"><span class="bl" title="${esc(r.k)}">${esc(r.k)}</span><span class="bt"><span style="width:${r.v/max*100}%;background:${r.c || color}"></span></span><span class="bv">${fmt(r.v)}</span></div>`).join("")}</div>`;
}
function donutHTML(parts, c1, c2){
  const tot = parts.reduce((s,p)=>s+p.v,0); const R = 58, C = 2*Math.PI*R; let off = 0;
  const segs = tot ? parts.filter(p=>p.v>0).map(p=>{ const len = p.v/tot*C; const s = `<circle cx="75" cy="75" r="${R}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(p.k)} : ${p.lbl}</title></circle>`; off += len; return s; }).join("") : "";
  return `<div class="donut"><svg viewBox="0 0 150 150" role="img" aria-label="${esc(c2)}"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--sunken)" stroke-width="22"/>${segs}<text x="75" y="76" text-anchor="middle" class="ctr1 ${String(c1).length>5?"sm":""}">${esc(c1)}</text><text x="75" y="95" text-anchor="middle" class="ctr2">${esc(c2)}</text></svg>
    <div class="legend">${parts.map(p=>`<div><i style="background:${p.c}"></i><span>${esc(p.k)}</span><em>${p.lbl}${tot?" · "+Math.round(p.v/tot*100)+" %":""}</em></div>`).join("")}</div></div>`;
}
const KEYS = `<div class="keys"><span><i style="background:var(--good)"></i>Réglé</span><span><i style="background:var(--bad)"></i>Non réglé</span><span><i style="background:var(--none)"></i>Non renseigné</span></div>`;

        <select id="dcat" class="seg" aria-label="Catégorie"><option value="all">Toutes catégories</option>${cats.map(c=>`<option ${S.dashCat===c?"selected":""}>${esc(c)}</option>`).join("")}</select>

    <div class="grid3">
      <div class="panel"><h3>Pièces payées</h3>${donutHTML([{k:"Réglés",v:qp,lbl:plural(qp,"article"),c:"var(--good)"},{k:"Non réglés",v:qu,lbl:plural(qu,"article"),c:"var(--bad)"},{k:"Non renseignés",v:qn,lbl:plural(qn,"article"),c:"var(--none)"}], q ? Math.round(qp/q*100)+" %" : "—", "réglés")}<span class="sub">${fmtEur(amtP)} encaissés sur ${fmtEur(amt)}</span></div>
      <div class="panel"><h3>Modes de règlement</h3>${donutHTML(Object.entries(modes).sort((x,y)=>y[1]-x[1]).map(([k,val],i)=>({k,v:val,lbl:fmtEur(val),c:pal[i%pal.length]})), fmtEur(amtP), "encaissé")}</div>

    </div>

  v.querySelectorAll("[data-df]").forEach(b => b.onclick = () => { S.dashFam = b.dataset.df; render(); });
  $("#dcat").onchange = e => { S.dashCat = e.target.value; render(); };
}

/* ---------- view: fiche (editable) ---------- */
function sizeSelect(a, i, val){
  const opts = Object.entries(SIZE_GROUPS).map(([g, arr]) => `<optgroup label="${g}">${arr.map(z => { const v = g + " " + z; return `<option ${val===v?"selected":""}>${v}</option>`; }).join("")}</optgroup>`).join("");
  const known = val && Object.entries(SIZE_GROUPS).some(([g,arr]) => arr.some(z => g + " " + z === val)) || val === "Taille unique";
  return `<select id="sz-${a.col}-${i}" data-size="${a.col}" data-i="${i}" class="${val ? "" : "todo"}" aria-label="Taille ${i+1} ${esc(a.name)}"><option value="">Taille ?</option>${opts}<option ${val==="Taille unique"?"selected":""}>Taille unique</option>${val && !known ? `<option selected>${esc(val)}</option>` : ""}</select>`;
}
function relatedPeople(p){
  if (!p.note) return [];
  const nn = " " + norm(p.note).replace(/[^a-z0-9 ]/g," ") + " ";
  return S.m.people.filter(o => o.uid !== p.uid && tokens(o.name).some(t => t.length >= 5 && nn.includes(" " + t + " ")));
}
function extraNotes(p){
  const pt = tokens(p.name);
  return S.m.extra.filter(e => { const et = tokens(e.who); const [a,b] = et.length <= pt.length ? [et,pt] : [pt,et]; return a.length >= 2 && a.every(t => b.includes(t)); });
}

  const p = person(S.sel); if (!p){ goBack(); return; }

  const c = calc(p), cmd = c.sc.cmd, day = c.sc.day, withCmd = cmd.q > 0;
  const rel = relatedPeople(p), ex = extraNotes(p);
  const artRow = a => { const q = p.qty[a.col] || 0, pn = paidN(p, a.col);
    return `<div class="artrow ${q?"on":""}">
      <div class="an"><b>${esc(a.name)}</b><span class="sub">${a.price ? fmtEur(a.price) : "prix non renseigné"}</span>${q ? (pn >= q ? `<span class="pstate ok">✓ payé</span>` : pn ? `<span class="pstate part">${pn}/${q} payé</span>` : `<span class="pstate no">à payer</span>`) : ""}</div>
      <div class="stepper"><button type="button" id="dec-${a.col}" data-dec="${a.col}" ${q?"":"disabled"} aria-label="Retirer ${esc(a.name)}">−</button><span aria-live="polite">${q}</span><button type="button" id="inc-${a.col}" data-inc="${a.col}" aria-label="Ajouter ${esc(a.name)}">+</button></div>
      <div class="st">${q ? fmtEur(q*a.price) : ""}</div>
      ${q && a.fam !== "autre" && !noSize(a.name) ? `<div class="sizes">${(p.sizes[a.col]||[]).map((s,i)=>sizeSelect(a,i,s)).join("")}</div>` : ""}
    </div>`; };
  const famBlock = f => { const arts = S.m.articles.filter(a => a.fam === f); const fq = arts.reduce((s,a)=>s+(p.qty[a.col]||0),0), famt = arts.reduce((s,a)=>s+(p.qty[a.col]||0)*a.price,0);

        <div class="badges" id="fBadges">${p.conflict ? `<span class="badge conflict lg">⚠ Conflit à revérifier</span>` : ""}${badgeCat(p.cat, true)}${scopeBadge("cmd")}${scopeBadge("day")}${withCmd && p.ref && p.prep ? `<span class="badge sac lg">Sac ${esc(p.ref)}</span>` : ""}${withCmd ? (p.ret ? `<span class="badge ret lg">✓ Retirée</span>` : p.prep ? `<span class="badge prepd lg">Préparée</span>` : "") : ""}</div>
      </div>
      <div class="paybig"><span class="lbl">A payé</span><div class="v" style="color:${c.st==="paid"?"var(--good)":c.st==="partial"?"var(--accent-ink)":"var(--bad)"}">${fmtEur(c.paidAmt)}</div><span class="sub">sur ${fmtEur(c.total)}${c.total - c.paidAmt > 0 ? ` · <b style="color:var(--bad)">reste ${fmtEur(c.total - c.paidAmt)}</b>` : ""}</span>${c.total - c.paidAmt > 0 && !S.pay ? `<button type="button" class="btn primary sm" data-paynew="all" style="margin-top:8px;align-self:flex-end">Paiement global (tenues + boutique)</button>` : ""}</div>
    </div>
    <div class="grid2">
      <div class="notebox"><label class="lbl" for="fNote">Note (colonne V)</label><textarea id="fNote" placeholder="Ajouter une note : paiement pour un autre adhérent, caution, échange…">${esc(p.note)}</textarea>
        ${rel.length ? `<div class="chips">${rel.map(o=>`<button class="chip" type="button" data-open="${o.uid}">Voir ${esc(title(o.name))}</button>`).join("")}</div>` : ""}
        ${ex.length ? `<span class="lbl">Onglet Notes du fichier</span>${ex.map(e=>`<p>${esc(e.text)}</p>`).join("")}` : ""}</div>
      <div class="panel"><h3>Adhérent</h3>
        <div class="field"><span class="lbl">Catégorie</span><div class="segs">
          <button type="button" id="cat-a" class="plain" data-cat="Adulte" aria-pressed="${p.cat==="Adulte"}">Adulte</button>
          <button type="button" id="cat-j" class="jeune" data-cat="Jeune" aria-pressed="${p.cat==="Jeune"}">Jeune</button></div></div>
        <label class="conflictbox ${p.conflict ? "on" : ""}" for="fConflict"><input type="checkbox" id="fConflict" ${p.conflict ? "checked" : ""}>Conflit, à revérifier<span class="sub" style="font-weight:400;margin-left:auto">${p.conflict ? "listé dans la synthèse" : "pour y revenir plus tard"}</span></label>
        <div class="field"><label for="fEmail">E-mail</label><input type="text" id="fEmail" inputmode="email" autocomplete="off" value="${esc(p.email)}" placeholder="adresse@exemple.fr"></div>
        <div class="row">${p.origin ? `<span class="sub">Origine : <b>${esc(p.origin)}</b></span>` : "<span></span>"}<span class="row" style="gap:8px">${S.armedDelete ? `<button type="button" class="linkbtn" id="delCancel">Annuler</button>` : ""}<button type="button" id="delBtn" class="btn sm danger ${S.armedDelete?"armed":""}">${S.armedDelete ? "Confirmer : supprimer la fiche" : "Supprimer la fiche"}</button></span></div>
      </div>
    </div>

    <section class="shopsec cmd">
      <div class="shophead"><div><h2>Commande tenues</h2><span class="sub">Trifonctions et tenues vélo · commandées au fournisseur, remises dans un sac au retrait</span></div>${withCmd ? badgeStatus(cmd.st) : `<span class="badge todo">Pas de commande</span>`}</div>
      <div class="fgrid">
        <div class="panel"><div class="row"><h3>Articles commandés</h3><span class="sub">${plural(cmd.q,"pièce")} · <b style="color:var(--ink)">${fmtEur(cmd.total)}</b></span></div>
          <span class="sub">+ et − pour choisir les articles, puis la taille de chaque pièce.</span>
          ${famBlock("tri")}${famBlock("velo")}</div>
        <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
          ${payPanel(p, c, "cmd")}
          ${withCmd ? `<div class="panel"><h3>Préparation & retrait</h3>
            <div class="field"><span class="lbl">Commande préparée ?</span><div class="segs">
              <button type="button" id="prep-o" class="paid" data-prep="1" aria-pressed="${p.prep}">Oui, préparée</button>
              <button type="button" id="prep-n" class="plain" data-prep="0" aria-pressed="${!p.prep}">Non</button></div></div>
            ${p.ref ? `<div class="refbox ${p.prep ? "" : "off"}"><span class="lbl">Référence du sac</span><span class="ref">${esc(p.ref)}</span><span class="sub">${p.prep ? "À écrire sur l'étiquette du sac." : "Référence réservée : elle sera reprise si la commande est de nouveau préparée."}</span></div>`
              : `<span class="sub">Une référence de sac (R1, R2…) est attribuée dès que la commande est marquée préparée. Prochaine : <b>R${S.m.nextRef}</b>.</span>`}
            <div class="field"><span class="lbl">Commande retirée ?</span><div class="segs">
              <button type="button" id="ret-o" class="paid" data-ret="1" aria-pressed="${p.ret}">Oui, retirée</button>
              <button type="button" id="ret-n" class="plain" data-ret="0" aria-pressed="${!p.ret}">Non</button></div>
              ${p.ret && p.retDate ? `<span class="sub">Retirée le ${esc(p.retDate)}</span>` : ""}</div>
            <div class="field"><label for="fRetNote">Note de retrait</label><input type="text" id="fRetNote" value="${esc(p.retNote)}" placeholder="ex. récupérée par Xavier Foucouin"></div>

        </div>

    <section class="shopsec day">
      <div class="shophead"><div><h2>Boutique</h2><span class="sub">Achats remis sur place : pas de sac ni de retrait</span></div>${day.q ? badgeStatus(day.st) : `<span class="badge todo">Aucun achat</span>`}</div>
      <div class="fgrid">
        <div class="panel"><div class="row"><h3>Articles achetés</h3><span class="sub">${plural(day.q,"pièce")} · <b style="color:var(--ink)">${fmtEur(day.total)}</b></span></div>${famBlock("autre")}</div>

  const rerender = () => { touch(); renderFiche(v); };
  v.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { const col = +b.dataset.inc; p.qty[col] = (p.qty[col]||0) + 1; fixSizes(p); rerender(); });
  v.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { const col = +b.dataset.dec; p.qty[col] = Math.max(0,(p.qty[col]||0) - 1); if (!p.qty[col]) delete p.qty[col]; fixSizes(p); rerender(); });
  v.querySelectorAll("[data-size]").forEach(s => s.onchange = () => { p.sizes[+s.dataset.size][+s.dataset.i] = s.value; rerender(); });
  v.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { p.cat = p.cat === b.dataset.cat ? "" : b.dataset.cat; rerender(); });
  bindPay(v, p, rerender);
  const giveRef = () => { if (!p.ref){ S.m.nextRef = Math.max(S.m.nextRef || 1, nextRefOf(S.m.people)); p.ref = "R" + (S.m.nextRef++); } };
  v.querySelectorAll("[data-prep]").forEach(b => b.onclick = () => { const on = b.dataset.prep === "1"; if (on === p.prep) return; p.prep = on; if (on) giveRef(); else { p.ret = false; p.retDate = ""; } rerender(); });
  v.querySelectorAll("[data-ret]").forEach(b => b.onclick = () => { const on = b.dataset.ret === "1"; if (on === p.ret) return; p.ret = on; if (on){ if (!p.prep){ p.prep = true; giveRef(); } p.retDate = new Date().toLocaleDateString("fr-FR"); } else p.retDate = ""; rerender(); });
  const rn = $("#fRetNote"); if (rn) rn.oninput = e => { p.retNote = e.target.value; touch(); };
  $("#fEmail").oninput = e => { p.email = clean(e.target.value); touch(); };
  $("#fConflict").onchange = e => { p.conflict = e.target.checked; rerender(); };
  $("#fName").oninput = e => { p.name = e.target.value; touch(); };
  $("#fName").onchange = () => renderNav();
  $("#fNote").oninput = e => { p.note = e.target.value; touch(); };
  $("#delBtn").onclick = () => {
    if (!S.armedDelete){ S.armedDelete = true; renderFiche(v); $("#delBtn").focus(); return; }
    const nm = title(p.name); S.m.people = S.m.people.filter(x => x.uid !== p.uid); S.armedDelete = false; touch();
    S.back = S.back.filter(b => !(b.view === "fiche" && b.sel === p.uid)); goBack(); showMsg(`Fiche de ${esc(nm)} supprimée.`, "ok");
  };
  const dc = $("#delCancel"); if (dc) dc.onclick = () => { S.armedDelete = false; renderFiche(v); };
  bindOpen(v);
  if (focusId){ const el = document.getElementById(focusId); if (el && el !== document.body) el.focus({ preventScroll:true }); }
}

/* ---------- paiements (transactions) ---------- */
const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const isoToFr = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ""); };
function restOf(p){ return S.m.articles.map(a => ({ a, rest: (p.qty[a.col] || 0) - paidN(p, a.col) })).filter(x => x.rest > 0); }
function payAmount(p, f){ return Object.entries(f.sel).reduce((s,[col,n]) => s + n * (S.m.articles.find(a => a.col === +col)?.price || 0), 0); }
function payPanel(p, c, scope){
  const f = S.pay && S.pay.uid === p.uid && S.pay.scope === scope ? S.pay : null;
  const restAll = restOf(p), s = c.sc[scope];
  const title_ = scope === "cmd" ? "Paiement de la commande" : "Paiement boutique";
  let form = "";
  if (f){
    const amt = f.amountTouched ? f.amount : payAmount(p, f);
    form = `<div class="payform">
      <div class="row"><h3>Nouveau paiement</h3><span class="chips"><button type="button" class="chip" data-pq="all">Tout le reste dû</button>${["cmd","day"].filter(k => restAll.some(x => scopeOf(x.a.fam) === k)).map(k => `<button type="button" class="chip" data-pq="${k}">${k === "cmd" ? "Tenues seulement" : "Boutique seulement"}</button>`).join("")}<button type="button" class="chip" data-pq="none">Aucun</button></span></div>
      <span class="sub">Cochez tout ce que la personne règle maintenant, tenues et boutique compris.</span>
      ${restAll.length ? ["cmd","day"].map(k => { const its = restAll.filter(x => scopeOf(x.a.fam) === k); return its.length ? `<span class="lbl">${SCOPES[k].label}</span>` + its.map(({ a, rest: r }) => { const on = !!f.sel[a.col]; return `<label class="pitem"><input type="checkbox" id="pi-${a.col}" data-pi="${a.col}" ${on?"checked":""}><span>${esc(a.name)}<span class="sub">${r > 1 ? `${r} pièces restantes` : "1 pièce"} · ${fmtEur(a.price)}</span></span>${r > 1 && on ? `<input type="number" id="pn-${a.col}" data-pn="${a.col}" min="1" max="${r}" value="${f.sel[a.col]}" aria-label="Nombre de pièces payées">` : "<span></span>"}<b>${on ? fmtEur(f.sel[a.col] * a.price) : ""}</b></label>`; }).join("") : ""; }).join("")
        : `<span class="sub">Tout est déjà payé. Vous pouvez quand même noter un paiement (caution, supplément…).</span>`}
      <div class="grid2" style="gap:10px">
        <div class="field"><label for="payMode">Mode</label><select id="payMode">${MODES.map(m => `<option ${f.mode===m?"selected":""}>${m}</option>`).join("")}</select></div>
        <div class="field"><label for="payAmt">Montant (€)</label><input type="number" id="payAmt" step="0.01" min="0" value="${amt}"></div>
        <div class="field"><label for="payDate">Date</label><input type="date" id="payDate" value="${f.date}"></div>
        <div class="field"><label for="payTime">Heure</label><input type="time" id="payTime" value="${f.time}"></div>
      </div>
      <div class="field"><label for="payNote">Note (facultatif)</label><input type="text" id="payNote" value="${esc(f.note)}" placeholder="ex. payé par Clara Morillon, 100 € de caution en chèque"></div>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn sm" id="payCancel">Annuler</button><button type="button" class="btn primary sm" id="paySave" ${Object.keys(f.sel).length || amt > 0 ? "" : "disabled"}>Enregistrer le paiement · ${fmtEur(amt)}</button></div>
    </div>`;
  }
  const mine = (p.tx || []).filter(tx => { const sc = txScopes(tx); return sc.includes(scope) || (!sc.length && scope === "cmd"); });
  const txs = mine.slice().reverse().map(tx => {
    const arts = Object.entries(tx.items).filter(([,n]) => n > 0).map(([col,n]) => { const a = S.m.articles.find(x => x.col === +col); return a ? `<span>${esc(a.name)}${n > 1 ? " ×" + n : ""}</span>` : ""; }).join("");
    const armed = S.armedTx === tx.id, both = txScopes(tx).length > 1;
    return `<div class="tx"><div class="row"><span><b>Paiement n° ${tx.id}</b> <span class="sub">${tx.date ? esc(tx.date) : "<i>date non renseignée</i>"}${tx.time ? " à " + esc(tx.time) : ""}</span></span><span class="row" style="gap:8px">${tx.mode ? `<span class="badge mode">${esc(tx.mode)}</span>` : ""}<span class="amt">${fmtEur(tx.amount)}</span><button type="button" class="xbtn ${armed ? "" : "undo"}" data-txdel="${tx.id}" title="${armed ? "Cliquer pour confirmer la suppression" : "Supprimer ce paiement"}" aria-label="Supprimer le paiement n° ${tx.id}">✕</button></span></div>
      <div class="arts">${arts || "<span class='sub'>Aucun article associé</span>"}</div>${both ? `<span class="sub">Paiement commun commande tenues + boutique</span>` : ""}${tx.note ? `<span class="sub">${esc(tx.note)}</span>` : ""}${armed ? `<span class="sub" style="color:var(--bad);font-weight:700">Cliquez encore sur ✕ pour supprimer ce paiement.</span>` : ""}</div>`;
  }).join("");
  if (!s.q && !mine.length) return `<div class="panel"><h3>${title_}</h3><span class="sub">${scope === "cmd" ? "Aucun article commandé." : "Aucun achat en boutique."}</span></div>`;
  return `<div class="panel"><div class="row"><h3>${title_}</h3>${f ? "" : `<button type="button" class="btn primary sm" data-paynew="${scope}">+ Enregistrer un paiement</button>`}</div>
    <dl class="facts"><dt>Payé</dt><dd style="color:var(--good)">${fmtEur(s.paid)} <span class="sub">(${s.pq} / ${plural(s.q,"pièce")})</span></dd><dt>Reste dû</dt><dd style="color:${s.total-s.paid>0?"var(--bad)":"inherit"}">${fmtEur(s.total - s.paid)}</dd></dl>
    ${form}
    ${txs ? `<span class="lbl">Historique</span>${txs}` : `<span class="sub">${s.st === "unknown" ? "Statut de paiement non renseigné." : "Aucun paiement enregistré."}</span>`}
  </div>`;
}
function bindPay(v, p, rerender){
  const redraw = () => renderFiche(v);
  v.querySelectorAll("[data-paynew]").forEach(b => b.onclick = () => { const k = b.dataset.paynew; const sc = k === "all" ? (hasCmd(p) ? "cmd" : "day") : k;
    S.pay = { uid:p.uid, scope:sc, sel:{}, mode:"Carte bancaire", date: todayISO(), time: nowHM(), note:"", amount:0, amountTouched:false };
    restOf(p).filter(x => k === "all" || scopeOf(x.a.fam) === k).forEach(({ a, rest }) => S.pay.sel[a.col] = rest); redraw();
    setTimeout(() => document.querySelector(".payform")?.scrollIntoView({ block:"center" }), 0); });
  if (!S.pay || S.pay.uid !== p.uid){
    v.querySelectorAll("[data-txdel]").forEach(b => b.onclick = () => { const id = +b.dataset.txdel; if (S.armedTx !== id){ S.armedTx = id; redraw(); return; } p.tx = p.tx.filter(x => x.id !== id); S.armedTx = null; rerender(); showMsg("Paiement supprimé.", "ok"); });
    return;
  }
  const f = S.pay;
  v.querySelectorAll("[data-txdel],[data-paynew]").forEach(b => b.disabled = true);
  v.querySelectorAll("[data-pi]").forEach(cb => cb.onchange = () => { const col = +cb.dataset.pi; if (cb.checked){ const r = restOf(p).find(x => x.a.col === col); f.sel[col] = r ? r.rest : 1; } else delete f.sel[col]; redraw(); });
  v.querySelectorAll("[data-pn]").forEach(n => n.onchange = () => { const col = +n.dataset.pn; const r = restOf(p).find(x => x.a.col === col); f.sel[col] = Math.max(1, Math.min(r ? r.rest : 1, Math.round(+n.value || 1))); redraw(); });
  v.querySelectorAll("[data-pq]").forEach(b => b.onclick = () => { const k = b.dataset.pq; f.sel = {}; f.amountTouched = false; if (k !== "none") restOf(p).filter(x => k === "all" || scopeOf(x.a.fam) === k).forEach(({ a, rest }) => f.sel[a.col] = rest); redraw(); });
  $("#payMode").onchange = e => f.mode = e.target.value;
  $("#payDate").onchange = e => f.date = e.target.value;
  $("#payTime").onchange = e => f.time = e.target.value;
  $("#payNote").oninput = e => f.note = e.target.value;
  $("#payAmt").oninput = e => { f.amount = +e.target.value || 0; f.amountTouched = true; const s = $("#paySave"); s.disabled = !(Object.keys(f.sel).length || f.amount > 0); s.textContent = "Enregistrer le paiement · " + fmtEur(f.amount); };
  $("#payCancel").onclick = () => { S.pay = null; redraw(); };
  $("#paySave").onclick = () => {
    const amount = f.amountTouched ? f.amount : payAmount(p, f);
    S.m.nextTx = Math.max(S.m.nextTx || 1, 1 + Math.max(0, ...S.m.people.flatMap(x => (x.tx || []).map(t => t.id))));
    p.tx = p.tx || []; p.tx.push({ id: S.m.nextTx++, date: isoToFr(f.date), time: f.time, mode: f.mode, items: { ...f.sel }, amount, note: clean(f.note) });
    if (!p.paid) p.paid = "Non";
    S.pay = null; rerender(); showMsg(`Paiement de ${fmtEur(amount)} enregistré pour ${esc(title(p.name))}.`, "ok");
  };
}

/* ---------- nouvelle commande ---------- */
function openNew(prefill){
  if (!S.m) return;
  $("#overlay").hidden = false; $("#newName").value = typeof prefill === "string" ? prefill : ""; $("#newExists").hidden = true;
  setNewCat("Adulte"); checkExists(); setTimeout(() => $("#newName").focus(), 0);
}
function closeNew(){ $("#overlay").hidden = true; }
function setNewCat(c){ S.newCat = c; $("#newCat").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === c)); }
function checkExists(){
  const n = norm($("#newName").value); const hit = n && S.m.people.find(p => norm(p.name) === n);
  const box = $("#newExists");
  if (hit){ box.hidden = false; box.innerHTML = `${esc(title(hit.name))} a déjà une commande. <button type="button" class="btn" id="openExisting">Ouvrir sa fiche</button>`; $("#openExisting").onclick = () => { closeNew(); openPerson(hit.uid); }; }
  else box.hidden = true;
}
$("#newBtn").addEventListener("click", () => openNew());
$("#newCancel").addEventListener("click", closeNew);
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeNew(); });
$("#overlay").addEventListener("keydown", e => { if (e.key === "Escape") closeNew(); });
$("#newCat").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setNewCat(b.dataset.v); });
$("#newName").addEventListener("input", checkExists);
$("#newForm").addEventListener("submit", e => {
  e.preventDefault(); const name = clean($("#newName").value); if (!name) return;
  const p = { uid: S.m.nextUid++, name, cat: S.newCat, qty:{}, sizes:{}, paid:"Non", mode:"", time:"", note:"", form:"", cells:[], tx:[], prep:false, ref:"", ret:false, retDate:"", retNote:"", email:"", origin:"Saisie manuelle" };
  S.m.people.push(p); touch(); closeNew(); openPerson(p.uid);
  showMsg(`Commande créée pour ${esc(title(name))}. Ajoutez les articles avec le bouton +.`, "ok");
});

/* ---------- search ---------- */
function searchPeople(q){
  const qt = tokens(q); if (!qt.length) return [];
  return S.m.people.map(p => { const pt = tokens(p.name + " " + (p.email || "")); const ok = qt.every(t => pt.some(x => x.includes(t))); const starts = qt.every(t => pt.some(x => x.startsWith(t))); return ok ? { p, s: starts ? 0 : 1 } : null; })
    .filter(Boolean).sort((a,b)=> a.s - b.s || a.p.name.localeCompare(b.p.name,"fr")).map(x=>x.p);
}
const qEl = $("#q"), sugEl = $("#suggest");
function renderSuggest(){
  const val = qEl.value; if (!S.m || !clean(val)){ sugEl.hidden = true; qEl.setAttribute("aria-expanded","false"); return; }
  S.sugg = searchPeople(val).slice(0, 8);
  const n = S.sugg.length; S.suggIdx = Math.min(S.suggIdx, n);
  sugEl.innerHTML = S.sugg.map((p,i)=>{ const c = calc(p); return `<li role="option" data-i="${i}" aria-selected="${i===S.suggIdx}"><span class="nm">${esc(title(p.name))}</span>${badgeStatus(c.st)}<span class="amt">${fmtEur(c.total)}</span></li>`; }).join("")
    + `<li role="option" class="create" data-i="${n}" aria-selected="${S.suggIdx===n}">+ Nouvelle commande pour « ${esc(clean(val))} »</li>`;
  sugEl.hidden = false; qEl.setAttribute("aria-expanded","true");
  sugEl.querySelectorAll("[data-i]").forEach(li => li.addEventListener("mousedown", e => { e.preventDefault(); pick(+li.dataset.i); }));
}
function pick(i){
  if (i >= S.sugg.length){ const v = clean(qEl.value); sugEl.hidden = true; qEl.value = ""; openNew(title(v)); return; }
  const p = S.sugg[i]; sugEl.hidden = true; qEl.value = ""; qEl.blur(); openPerson(p.uid);
}
qEl.addEventListener("input", () => { S.suggIdx = 0; renderSuggest(); });
qEl.addEventListener("focus", renderSuggest);
qEl.addEventListener("blur", () => setTimeout(()=> sugEl.hidden = true, 120));
qEl.addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ e.preventDefault(); S.suggIdx = Math.min(S.sugg.length, S.suggIdx+1); renderSuggest(); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); S.suggIdx = Math.max(0, S.suggIdx-1); renderSuggest(); }
  else if (e.key === "Enter"){ e.preventDefault(); if (clean(qEl.value)) pick(S.suggIdx); }
  else if (e.key === "Escape"){ sugEl.hidden = true; }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !$("#overlay").hidden || !$("#supOverlay").hidden || !$("#shopOverlay").hidden || S.view !== "fiche") return;
  const t = document.activeElement?.tagName; if (t === "TEXTAREA" || t === "INPUT" || t === "SELECT") return;
  goBack();
});

/* ---------- boot ---------- */
S.view = "accueil"; render();
(async () => { try { if (window.claude?.use) S.downloads = await window.claude.use("downloads"); } catch(_){} })();
</script>
