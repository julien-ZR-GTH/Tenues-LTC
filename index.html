  --c2:#DCDAD5; --c3:#6E6C67; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1A1A1D; --sunken:#242428; --ink:#EEEDEA; --muted:#A8A59F; --line:#323238;
  --accent:#F5A123; --accent-ink:#F7B24C; --accent-soft:#3A2A12; --on-accent:#1B1205;
  --good:#3DBE7C; --good-soft:#163323; --on-good:#06180E;
  --bad:#F07763; --bad-soft:#3D1D18; --on-bad:#2A0B06;
  --none:#9C9993; --none-soft:#2A2A2E; --on-none:#141416;
  --tri:#F5A123; --velo:#6CA6EA; --autre:#B49AE0;
  --c2:#DCDAD5; --c3:#6E6C67; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{font-family:var(--font-display);font-weight:700;font-size:24px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{background:#fff;border-radius:8px;padding:4px 6px;display:flex;border:1px solid var(--line);flex:none;cursor:pointer}
.logo img{height:44px;width:auto;display:block}
.brand{display:flex;flex-direction:column;flex:none}
.brand .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:25px;line-height:1}
.brand .ver{font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--accent-ink);margin-left:6px;vertical-align:middle}
.search{position:relative;flex:1 1 240px;min-width:0}
.search input{width:100%;height:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);padding:0 16px 0 40px}
.search input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.search input:disabled{opacity:.55}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.16);list-style:none;margin:0;padding:6px;max-height:380px;overflow:auto;z-index:5}
.suggest li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer}
.suggest li[aria-selected="true"],.suggest li:hover{background:var(--sunken)}
.suggest .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest .amt{color:var(--muted);font-size:13px}
.suggest .create{color:var(--accent-ink);font-weight:600;border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.actions{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;position:relative}
.btn:hover{border-color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--on-bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.linkbtn{background:none;border:0;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

/* Nav bar */
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 0}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.crumbs .path{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.crumbs .path b{color:var(--ink)}
.source{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.source b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.unsaved{display:inline-flex;align-items:center;gap:6px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px}
.saved{display:inline-flex;align-items:center;gap:6px;background:var(--good-soft);color:var(--good);font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px}
.msg{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.warn{background:var(--accent-soft);color:var(--accent-ink)}

main .wrap{padding-block:20px 56px}
#view{display:flex;flex-direction:column;gap:22px}

/* Badges (strong, readable labels) */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:7px;font-size:13px;font-weight:700;white-space:nowrap;letter-spacing:.01em;line-height:1.3}
.badge.lg{font-size:15px;padding:7px 14px;border-radius:8px}
.badge.paid{background:var(--good);color:var(--on-good)}
.badge.unpaid{background:var(--bad);color:var(--on-bad)}
.badge.unknown{background:var(--none);color:var(--on-none)}
.badge.partial{background:var(--accent);color:var(--on-accent)}
.badge.adulte{background:var(--ink);color:var(--bg)}
.badge.jeune{background:var(--accent);color:var(--on-accent)}
.badge.nocat{background:var(--sunken);color:var(--muted);border:1px dashed var(--muted)}
.badge.mode,.badge.time{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.badge svg{width:14px;height:14px}
.fam{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.fam.tri{background:var(--tri)}.fam.velo{background:var(--velo)}.fam.autre{background:var(--autre)}

/* Blank state */
.blank{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;max-width:680px;margin:20px auto}
.blank .logo{cursor:default}
.blank .logo img{height:90px}
.blank h2{font-size:30px}
.blank p{margin:0;color:var(--muted);max-width:52ch}
.blank .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.resume{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:14px}

/* KPIs + panels */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .val{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.05}
.kpi.good .val{color:var(--good)} .kpi.bad .val{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.track{height:14px;border-radius:999px;background:var(--sunken);overflow:hidden;display:flex}
.track span{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* Family cards */
.famcard{border-top:5px solid var(--fc)}
.famcard.tri{--fc:var(--tri)}.famcard.velo{--fc:var(--velo)}.famcard.autre{--fc:var(--autre)}
.famcard .big{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1}
.famcard .split{display:flex;gap:8px;flex-wrap:wrap}
.famcard .duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.famcard .duo div{background:var(--sunken);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.famcard .duo b{font-family:var(--font-display);font-size:28px;line-height:1}
.artlist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.artlist .ar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.artlist .ar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:inline-flex;gap:4px;align-items:center;font-weight:600}
.mini .g{color:var(--good)} .mini .b{color:var(--bad)}

.attn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.conflictbox{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.conflictbox input{width:20px;height:20px;accent-color:var(--bad)}
.conflictbox.on{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad)}
.badge.conflict{background:var(--bad-soft);color:var(--bad);border:2px solid var(--bad)}
@media (max-width:1100px){.attn{grid-template-columns:repeat(2,minmax(0,1fr))}}
.attn h3{display:flex;align-items:baseline;gap:8px}
.attn .count{font-family:var(--font-display);font-size:22px;color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip.static{cursor:default}
.chip.static:hover{border-color:var(--line)}

/* Tables */
.tablehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.seg{padding-right:8px}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
.tablebox table{min-width:1140px}
th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
th.num,td.num{text-align:right}
th.c,td.c{text-align:center}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.clickrows tbody tr{cursor:pointer}
.clickrows tbody tr:hover td{background:var(--sunken)}
tfoot td{font-weight:700;border-bottom:0;background:var(--sunken)}
td.name{font-weight:600}
.cnt{display:inline-flex;min-width:26px;justify-content:center;padding:2px 7px;border-radius:6px;font-weight:700;font-size:13px}
.cnt.tri{background:color-mix(in srgb,var(--tri) 22%,transparent)}
.cnt.velo{background:color-mix(in srgb,var(--velo) 22%,transparent)}
.cnt.autre{background:color-mix(in srgb,var(--autre) 22%,transparent)}
.cnt.zero{background:none;color:var(--muted);font-weight:400}
.noteflag{display:inline-flex;width:24px;height:24px;border-radius:6px;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px}
.sizechips{display:flex;flex-wrap:wrap;gap:4px}
.sizechips span{background:var(--sunken);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600;white-space:nowrap}
.sizechips span.todo{background:var(--accent-soft);color:var(--accent-ink)}

/* Charts */
.bars{display:flex;flex-direction:column;gap:7px}
.barrow{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 5.5em;gap:10px;align-items:center;font-size:13.5px}
.barrow .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .bt{height:16px;background:var(--sunken);border-radius:4px;overflow:hidden;display:flex}
.barrow .bt span{display:block;height:100%;transition:width .4s ease}
.barrow .bv{text-align:right;font-weight:700}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:10px;height:10px;border-radius:2px;display:block}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.donut .ctr1{font-family:var(--font-display);font-weight:700;font-size:26px;fill:var(--ink)}
.donut .ctr1.sm{font-size:19px}
.donut .ctr2{font-size:11px;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13.5px;min-width:0;flex:1}
.legend div{display:grid;grid-template-columns:12px minmax(0,1fr);gap:0 8px;align-items:center}
.legend div em{grid-column:2;font-style:normal;color:var(--muted);font-size:12.5px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}

/* Fiche */
.fhead{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-start}
.fhead .left{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 320px}
.nameinput{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1.1;border:0;border-bottom:2px dashed transparent;background:none;padding:0;width:100%;min-width:0}
.nameinput:hover{border-bottom-color:var(--line)}
.nameinput:focus{outline:none;border-bottom-color:var(--accent)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paybig{text-align:right;display:flex;flex-direction:column;gap:2px}
.paybig .v{font-family:var(--font-display);font-weight:700;font-size:42px;line-height:1}
.fgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.famsec{display:flex;flex-direction:column;gap:2px}
.famsec + .famsec{margin-top:10px}
.famsec .fh{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px solid var(--line);font-family:var(--font-display);font-weight:600;font-size:17px}
.famsec .fh .sub{margin-left:auto;font-family:var(--font-body)}
.artrow{display:grid;grid-template-columns:minmax(0,1fr) auto 5.5em;gap:6px 12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.artrow.on{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.artrow .an{display:flex;flex-direction:column;min-width:0}
.artrow .an b{font-weight:600}
.artrow .st{text-align:right;font-weight:700}
.artrow .sizes{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;padding-left:2px}
.artrow .sizes select{height:32px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);padding:0 6px;font-size:13px}
.artrow .sizes select.todo{border-color:var(--accent);background:var(--accent-soft)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.stepper button{width:34px;height:32px;border:0;background:none;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.stepper button:hover{background:var(--sunken)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper span{min-width:26px;text-align:center;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field select,.field input[type=time],.field input[type=text]{height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);padding:0 10px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.segs button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.segs button[aria-pressed="true"].paid{background:var(--good);border-color:var(--good);color:var(--on-good)}
.segs button[aria-pressed="true"].unpaid{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.segs button[aria-pressed="true"].unknown{background:var(--none);border-color:var(--none);color:var(--on-none)}
.segs button[aria-pressed="true"].plain{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.segs button[aria-pressed="true"].jeune{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.notebox{background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.notebox .lbl{color:var(--accent-ink)}
.notebox textarea{width:100%;min-height:96px;resize:vertical;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:8px;background:var(--surface);padding:10px;font-size:15px;line-height:1.45}
.notebox p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:700;text-align:right}

/* Préparation */
.badge.sac{background:var(--accent-soft);color:var(--accent-ink);border:2px solid var(--accent);font-family:var(--font-display);font-size:15px;letter-spacing:.03em}
.badge.sac.lg{font-size:19px;padding:4px 14px}
.badge.ret{background:var(--surface);color:var(--good);border:2px solid var(--good)}
.badge.prepd{background:var(--surface);color:var(--ink);border:2px dashed var(--ink)}
.badge.todo{background:var(--sunken);color:var(--muted)}
.refbox{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:var(--accent-soft);border:2px solid var(--accent);border-radius:var(--r);padding:10px 14px}
.refbox .ref{font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1;color:var(--ink);letter-spacing:.02em}
.refbox.off{background:var(--sunken);border-style:dashed;border-color:var(--line)}
.refbox.off .ref{color:var(--muted)}
.field input[type=text]{width:100%}
.prevtable{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.prevtable table{font-size:13px}
.prevtable td,.prevtable th{padding:6px 10px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{accent-color:var(--accent)}
.radio .sub{font-weight:400;margin-left:auto}
/* Paiements */
.scopes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.scopecard .big{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1}
.scoperow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.scoperow b{font-weight:700}
.pstate{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:3px;width:max-content}
.pstate.ok{background:var(--good-soft);color:var(--good)} .pstate.part{background:var(--accent-soft);color:var(--accent-ink)} .pstate.no{background:var(--bad-soft);color:var(--bad)}
.tx{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.tx .row{gap:8px}
.tx .amt{font-family:var(--font-display);font-weight:700;font-size:20px}
.tx .arts{display:flex;flex-wrap:wrap;gap:4px}
.tx .arts span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600}
.payform{border:2px solid var(--accent);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--accent-soft)}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px}
.pitem input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.pitem input[type=number]{width:56px;height:30px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);padding:0 6px}
.pitem .sub{display:block}
.payform .field input,.payform .field select{height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);padding:0 10px;width:100%}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px}
@media (max-width:980px){.scopes{grid-template-columns:1fr}}
.shopsec{display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--line);padding-top:14px}
.shopsec.cmd{border-top-color:var(--velo)} .shopsec.day{border-top-color:var(--autre)}
.shophead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.shophead h2{font-size:28px}
/* Import */
.pendcount{display:inline-flex;min-width:20px;height:20px;align-items:center;justify-content:center;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11.5px;padding:0 6px;margin-left:2px}
.dropcard{border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.dropcard.loaded{border-style:solid}
.dropcard.tri.loaded{border-color:var(--tri)} .dropcard.velo.loaded{border-color:var(--velo)}
.imp{min-width:980px}
.imp td{vertical-align:top}
.imp tr.rh td{background:var(--sunken);border-top:2px solid var(--line)}
.imp tr.rh.tri td:first-child{box-shadow:inset 4px 0 0 var(--tri)} .imp tr.rh.velo td:first-child{box-shadow:inset 4px 0 0 var(--velo)}
.imp tr.off td{opacity:.45} .imp tr.off td.x{opacity:1}
.imp tr.off .strike{text-decoration:line-through}
.imp select{height:34px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);padding:0 6px;max-width:230px}
.xbtn{width:32px;height:32px;border-radius:8px;border:0;background:var(--bad);color:var(--on-bad);font-weight:800;font-size:16px;cursor:pointer;line-height:1}
.xbtn.undo{background:var(--sunken);color:var(--ink);font-size:15px}
.act{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.act.add{background:var(--good);color:var(--on-good)} .act.fill{background:var(--velo);color:#fff} .act.dup{background:var(--sunken);color:var(--muted)} .act.new{background:var(--accent);color:var(--on-accent)}
.rem{font-size:12.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-width:360px}
.warnlist{margin:0;padding-left:18px;font-size:13.5px}
details.ign summary{cursor:pointer;font-weight:600}
/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(10,10,12,.5);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 60px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:480px;max-height:calc(100vh - 110px);overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal input[type=text]{height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.modal .row{justify-content:flex-end}

@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.attn,.grid3{grid-template-columns:1fr}.grid2,.fgrid{grid-template-columns:1fr}}
@media (max-width:640px){.brand{display:none}.actions .btn span{display:none}.actions .btn{padding:0 12px}.barrow{grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 4.5em}.nameinput{font-size:30px}.paybig{text-align:left}.kpi .val{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const CATALOG = {"header": ["Nom et prénom", "Categorie", "Maillot vélo manches courtes (unisexe)", "Veste vélo hiver femme", "Veste vélo hiver homme", "Veste vélo mi-saison (mixte)", "Cuissard court femme", "Cuissard court homme", "Chasuble (mixte)", "Trifonction courte distance", "Trifonction longue distance", "Maillot course à pied manches courtes", "Porte-dossard", "Chaussettes", "Casquette", "bandeau", "flasque", "Réglé ?", "Mode de règlement", "Heure transaction", "TOTAL (€)", "Notes", "Formaulaire google correspond"], "price": ["Prix unitaire (€)", null, 60, 95, 95, 95, 75, 75, 55, 100, 120, 34, null, 18, 18, 5, 4, null, null, null, null, null, "Non"]};

const S = { shopF:"all", shop:null, stage:{ rows:[], ignored:[], files:{} }, prepF:"all", supPaid:false, inClaude: !!(window.claude && window.claude.use), m:null, view:"synthese", back:[], sel:null, filter:"all", cat:"all", fam:"all", sort:{key:"name",dir:1}, dashFam:"all", dashCat:"all", ordCat:"all", sugg:[], suggIdx:0, newCat:"Adulte", armedDelete:false, downloads:null };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean = s => String(s ?? "").replace(/\s+/g," ").trim();
const norm = s => clean(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const title = s => clean(s).toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const toNum = v => { if (typeof v === "number") return isFinite(v) ? v : 0; if (typeof v === "string") { const n = parseFloat(v.replace(",",".").replace(/[^\d.\-]/g,"")); return isFinite(n) ? n : 0; } return 0; };

const fmtInt = n => new Intl.NumberFormat("fr-FR").format(n||0);
const tokens = s => norm(s).split(" ").filter(t => t.length > 1);
const plural = (n, w) => n + " " + w + (n > 1 ? "s" : "");
const familyOf = name => { const n = norm(name); if (/trifonction/.test(n)) return "tri"; if (/velo|cuissard|chasuble/.test(n)) return "velo"; return "autre"; };
const noSize = name => /flasque|bandeau|porte-dossard|casquette/.test(norm(name));
const SCOPES = { cmd:{ label:"Commande tenues", short:"Tenues", hint:"trifonctions + vélo · commande fournisseur, sac, retrait" }, day:{ label:"Boutique", short:"Boutique", hint:"goodies, maillot course à pied… · remis sur place" } };
const scopeOf = fam => fam === "autre" ? "day" : "cmd";
const statusOf = p => calc(p).st;
const ICON_CLOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
const ICON_CARD = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>`;
const badgeStatus = (st, lg) => `<span class="badge ${st} ${lg?"lg":""}">${STATUS[st]}</span>`;
const badgeCat = (c, lg) => { const n = norm(c); const k = n === "jeune" ? "jeune" : n === "adulte" ? "adulte" : "nocat"; return `<span class="badge ${k} ${lg?"lg":""}">${esc(c || "Catégorie ?")}</span>`; };
const badgeMode = (m, lg) => m ? `<span class="badge mode ${lg?"lg":""}">${ICON_CARD}${esc(m)}</span>` : "";
const badgeTime = (t, lg) => t ? `<span class="badge time ${lg?"lg":""}">${ICON_CLOCK}${esc(t)}</span>` : "";

function fmtTime(v){
  if (v == null || v === "") return "";
  if (typeof v === "number") { const m = Math.round((v % 1) * 1440); return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
  if (v instanceof Date) return String(v.getHours()).padStart(2,"0")+":"+String(v.getMinutes()).padStart(2,"0");
  const s = clean(v); const mm = s.match(/(?:^|[\sT])(\d{1,2})[:h](\d{2})/); if (mm) return mm[1].padStart(2,"0")+":"+mm[2];
  return /\d{1,4}[\/.-]\d{1,2}[\/.-]\d{1,4}/.test(s) ? "" : s;
}
/* date part of a cell holding a date, a date + time, or only a time → "jj/mm/aaaa" */
function dateOfCell(v){
  if (v == null || v === "") return "";
  if (typeof v === "number") return v >= 1 ? fmtDate(Math.floor(v)) : "";
  if (v instanceof Date) return v.toLocaleDateString("fr-FR");
  const s = clean(v); let m = s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m){ const y = m[3].length === 2 ? "20" + m[3] : m[3]; return m[1].padStart(2,"0") + "/" + m[2].padStart(2,"0") + "/" + y; }
  m = s.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); if (m) return m[3].padStart(2,"0") + "/" + m[2].padStart(2,"0") + "/" + m[1];
  return "";
}
/* Excel cell for a payment's date and time */
function dtCell(date, time){
  const d = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(date || ""), h = /^(\d{2}):(\d{2})$/.exec(time || "");
  const day = d ? (Date.UTC(+d[3], +d[2] - 1, +d[1]) - Date.UTC(1899, 11, 30)) / 86400000 : 0, frac = h ? (+h[1] * 60 + +h[2]) / 1440 : 0;
  if (d && h) return { t:"n", v: day + frac, z:"dd/mm/yyyy hh:mm" };
  if (d) return { t:"n", v: day, z:"dd/mm/yyyy" };
  if (h) return { t:"n", v: frac, z:"hh:mm" };
  return null;
}
const txWhen = t => t ? [t.date, t.time].filter(Boolean).join(" ") : "";
const whenKey = t => { if (!t) return ""; const d = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t.date || ""); return (d ? d[3] + d[2] + d[1] : "00000000") + (t.time || ""); };
function normMode(v){
  const n = norm(v); if (!n) return "";
  if (/carte|\bcb\b/.test(n)) return "Carte bancaire";
  if (/cheq/.test(n)) return "Chèque";
  if (/esp/.test(n)) return "Espèces";
  if (/vir/.test(n)) return "Virement";
  return clean(v);
}
/* Article cell in the Commandes sheet: a number (pieces without size) or sizes joined by " + " ("?" = size to specify) */
function parseCell(v){
  if (v == null || v === "") return [];
  if (typeof v === "number") return v > 0 ? Array(Math.round(v)).fill("") : [];
  const out = [];
  String(v).split("+").map(clean).forEach(part => {
    if (!part) return;
    if (/^\d+$/.test(part)){ for (let k = 0; k < +part; k++) out.push(""); return; }
    if (/^(\?|x|oui|à préciser|a preciser)$/i.test(part)){ out.push(""); return; }
    out.push(part);
  });
  return out;
}
function cellOf(p, a){
  const q = p.qty[a.col] || 0; if (!q) return null;
  const arr = (p.sizes[a.col] || []).slice(0, q); while (arr.length < q) arr.push("");
  if (arr.every(s => !s)) return q;
  return arr.map(s => s || "?").join(" + ");
}
function fmtDate(v){
  if (v == null || v === "") return "";
  if (typeof v === "number" && v > 1000){ const d = new Date(Math.round((v - 25569) * 86400000)); return d.toLocaleDateString("fr-FR", { timeZone:"UTC" }); }
  if (v instanceof Date) return v.toLocaleDateString("fr-FR");
  return clean(v);
}
const refNum = r => +((/^R(\d+)$/i.exec(r || "") || [])[1] || 0);
const nextRefOf = people => 1 + Math.max(0, ...people.map(p => refNum(p.ref)));
function migrate(m){
  const L = m.layout;
  let i = Math.max(L.header.length, L.iForm + 1); PREP_COLS.forEach(([k, label]) => { if (L[k] == null){ L[k] = i; L.header[i++] = label; } });
  m.people.forEach(p => { p.prep = !!p.prep; p.ref = p.ref || ""; p.ret = !!p.ret; p.retDate = p.retDate || ""; p.retNote = p.retNote || ""; p.email = p.email || ""; p.origin = p.origin || ""; p.date = p.date || ""; p.conflict = !!p.conflict; });
  m.imports = m.imports || [];
  if (m.nextTx == null){ let n = 1; m.people.forEach(p => { if (!p.tx){ p.tx = legacyTx(p); p.tx.forEach(t => t.id = n++); } }); m.nextTx = n; }
  m.people.forEach(p => { p.tx = p.tx || []; });
  m.nextRef = Math.max(m.nextRef || 1, nextRefOf(m.people));
  return m;
}
function bytesToB64(u8){ let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBytes(b){ const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
const colL = i => XLSX.utils.encode_col(i);

/* ---------- model ---------- */
/* pieces of an article covered by the person's payments */
function paidN(p, col){ const q = p.qty[col] || 0; let n = 0; (p.tx || []).forEach(t => n += +(t.items[col] || 0)); return Math.min(q, n); }
function calc(p){
  const items = S.m.articles.map(a => { const q = p.qty[a.col] || 0; if (!(q > 0)) return null; const pn = paidN(p, a.col); return { ...a, q, pn, sub: q * a.price, paidSub: pn * a.price }; }).filter(Boolean);
  const total = items.reduce((s,x)=>s+x.sub,0), paidAmt = items.reduce((s,x)=>s+x.paidSub,0);
  const qty = items.reduce((s,x)=>s+x.q,0), pq = items.reduce((s,x)=>s+x.pn,0);
  const unknown = !(p.tx || []).length && !p.paid;
  const stOf = (q, pq) => pq >= q && q > 0 ? "paid" : pq > 0 ? "partial" : unknown ? "unknown" : "unpaid";
  const sc = {}; Object.keys(SCOPES).forEach(k => { const its = items.filter(i => scopeOf(i.fam) === k); const sq = its.reduce((s,x)=>s+x.q,0), spq = its.reduce((s,x)=>s+x.pn,0);
    sc[k] = { q:sq, pq:spq, total: its.reduce((s,x)=>s+x.sub,0), paid: its.reduce((s,x)=>s+x.paidSub,0), st: sq ? stOf(sq, spq) : "none" }; });
  const famQ = { tri:0, velo:0, autre:0 }; items.forEach(i => famQ[i.fam] += i.q);
  return { items, total, paidAmt, qty, pq, st: qty ? stOf(qty, pq) : (unknown ? "unknown" : "unpaid"), sc, famQ };
}
const txScopes = (tx) => [...new Set(Object.keys(tx.items).filter(c => tx.items[c] > 0).map(c => S.m.articles.find(a => a.col === +c)).filter(Boolean).map(a => scopeOf(a.fam)))];
const lastDayTx = p => (p.tx || []).filter(t => txScopes(t).includes("day")).slice(-1)[0];
const hasCmd = p => S.m.articles.some(a => a.fam !== "autre" && (p.qty[a.col] || 0) > 0);
const txModes = p => [...new Set((p.tx || []).map(t => t.mode).filter(Boolean))];
const lastTx = p => (p.tx || []).filter(x => x.time || x.date).slice(-1)[0];
const txLast = p => txWhen(lastTx(p));
function legacyTx(p){
  if (p.paid !== "Oui") return [];
  const items = {}; Object.entries(p.qty).forEach(([c, q]) => { if (q > 0) items[c] = q; });
  const amount = S.m.articles.reduce((s,a) => s + (p.qty[a.col] || 0) * a.price, 0);
  return [{ id: 0, date: p.date || "", time: p.time || "", mode: p.mode || "", items, amount, note:"Reprise : « Réglé ? Oui » dans le fichier" }];
}
function fixSizes(p){
  S.m.articles.forEach(a => {
    const q = p.qty[a.col] || 0; let arr = (p.sizes[a.col] || []).slice(0, q);
    while (arr.length < q) arr.push("");
    if (q) p.sizes[a.col] = arr; else delete p.sizes[a.col];
  });
}
const person = uid => S.m && S.m.people.find(p => p.uid === uid);

/* ---------- parsing ---------- */
function parseWorkbook(sheets){
  const names = Object.keys(sheets);
  const cmdName = names.find(n => /commande/i.test(n)) || names[0];
  const rows = sheets[cmdName] || [];
  const hIdx = rows.findIndex(r => r && /nom/.test(norm(r[0])));
  if (hIdx < 0) throw new Error(`La ligne d'en-tête « Nom et prénom » est introuvable dans l'onglet « ${cmdName} ».`);
  const header = rows[hIdx].map(h => h == null ? null : String(h));
  const H = header.map(norm);
  const find = (re, fb) => { const i = H.findIndex(h => re.test(h)); return i >= 0 ? i : fb; };
  const L = { sheet: cmdName, header, hIdx, iCat: find(/^categ/,1), iPaid: find(/^regle/,17), iMode: find(/mode de reg/,18), iTime: find(/heure/,19), iTotal: find(/^total/,20), iNotes: find(/^notes?\b/,21), iForm: find(/formaulaire|formulaire/,22) };
  PREP_COLS.forEach(([k, label]) => { const re = COL_RE[k];
    let i = H.findIndex(h => re.test(h)); if (i < 0){ i = Math.max(header.length, L.iForm + 1); header[i] = label; H[i] = norm(label); } L[k] = i; });
  const pIdx = hIdx + 1; const hasPrice = rows[pIdx] && /prix/.test(norm(rows[pIdx][0]));
  L.priceRow = hasPrice ? rows[pIdx].slice() : ["Prix unitaire (€)"];
  L.preRows = rows.slice(0, hIdx).map(r => (r || []).slice());
  const articles = [];
  for (let i = L.iCat + 1; i < L.iPaid; i++) if (clean(header[i])) articles.push({ col:i, name: clean(header[i]), price: toNum(L.priceRow[i]), fam: familyOf(header[i]) });
  const people = [], fileNotes = []; let uid = 1;
  for (let r = (hasPrice ? pIdx + 1 : hIdx + 1); r < rows.length; r++){
    const row = rows[r] || []; const raw = clean(row[0]); if (!raw) continue;
    const qty = {}, sizes = {}; articles.forEach(a => { const s = parseCell(row[a.col]); if (s.length){ qty[a.col] = s.length; sizes[a.col] = s; } });
    const pn = norm(row[L.iPaid]);
    if (!Object.keys(qty).length && !pn && !clean(row[L.iCat])) { fileNotes.push(row.slice()); continue; }
    const cat = clean(row[L.iCat]);
    people.push({ uid: uid++, name: title(raw), cat: cat ? title(cat) : "", qty, sizes,
      paid: pn.startsWith("oui") ? "Oui" : pn.startsWith("non") ? "Non" : "",
      mode: normMode(row[L.iMode]), time: fmtTime(row[L.iTime]), date: dateOfCell(row[L.iTime]),
      note: String(row[L.iNotes] ?? "").trim(), form: clean(row[L.iForm]), cells: row.slice(),
      prep: norm(row[L.iPrep]).startsWith("oui"), ref: clean(row[L.iRef]).toUpperCase(), ret: norm(row[L.iRet]).startsWith("oui"),
      retDate: fmtDate(row[L.iRetDate]), retNote: String(row[L.iRetNote] ?? "").trim(),
      email: clean(row[L.iEmail]), origin: clean(row[L.iOrigin]), conflict: norm(row[L.iConflict]).startsWith("oui") });
  }
  // Tailles sheet (written by this app's export, or later by a Google Form import)
  const tName = names.find(n => /^tailles?$/i.test(n.trim()));
  if (tName){
    const tr = sheets[tName] || []; const th = (tr[0] || []).map(norm);
    const ci = (re, fb) => { const i = th.findIndex(h => re.test(h)); return i >= 0 ? i : fb; };
    const cN = ci(/^nom/,0), cA = ci(/^article/,3), cT = ci(/^taille/,4), cQ = ci(/^quantit/,5);
    for (let r = 1; r < tr.length; r++){
      const row = tr[r] || []; const nm = norm(row[cN]); if (!nm) continue;
      const p = people.find(x => norm(x.name) === nm); const a = articles.find(x => norm(x.name) === norm(row[cA]));
      if (!p || !a) continue;
      const t = clean(row[cT]); const q = Math.max(1, Math.round(toNum(row[cQ]) || 1));
      if (/preciser/.test(norm(t))) continue;
      const arr = p.sizes[a.col] = p.sizes[a.col] || []; for (let k = 0; k < q; k++){ const e = arr.indexOf(""); if (e < 0) break; arr[e] = t; }
    }
  }
  const imports = [];
  const iName = names.find(n => /^imports?/i.test(n.trim()));
  if (iName){ const ir = sheets[iName] || []; const ih = (ir[0] || []).map(norm); const c = re => ih.findIndex(h => re.test(h));
    const cK = c(/^cle/), cF = c(/^formulaire/), cT = c(/^horodat/), cM = c(/mail/), cN = c(/^nom/), cW = c(/^adherent/), cD = c(/^importe/);
    for (let r = 1; r < ir.length; r++){ const row = ir[r] || []; const key = clean(row[cK]); if (key) imports.push({ key, form: clean(row[cF]), ts: clean(row[cT]), email: clean(row[cM]), name: clean(row[cN]), who: clean(row[cW]), at: fmtDate(row[cD]) }); } }
  const txName = names.find(n => /^transactions?$/i.test(n.trim()));
  people.forEach(p => p.tx = []);
  let nextTx = 1;
  if (txName){
    const tr = sheets[txName] || []; const th = (tr[0] || []).map(norm); const c = re => th.findIndex(h => re.test(h));
    const cId = c(/^n/), cN = c(/^adherent/), cM = c(/mail/), cD = c(/^date/), cT = c(/^heure/), cMo = c(/^mode/), cA = c(/^montant/), cI = c(/^articles/), cNo = c(/^note/);
    for (let r = 1; r < tr.length; r++){
      const row = tr[r] || []; const nm = norm(row[cN]), em = norm(row[cM]); if (!nm && !em) continue;
      const p = people.find(x => norm(x.name) === nm) || (em && people.find(x => norm(x.email) === em)); if (!p) continue;
      const items = {};
      String(row[cI] ?? "").split(";").map(clean).filter(Boolean).forEach(part => {
        const mm = /^(.*?)\s*[×x]\s*(\d+)$/.exec(part); const an = norm(mm ? mm[1] : part), n = mm ? +mm[2] : 1;
        const a = articles.find(x => norm(x.name) === an); if (a) items[a.col] = (items[a.col] || 0) + n; });
      const id = Math.round(toNum(row[cId])) || nextTx; nextTx = Math.max(nextTx, id + 1);
      p.tx.push({ id, date: dateOfCell(row[cD]) || dateOfCell(row[cT]), time: fmtTime(row[cT]) || fmtTime(row[cD]), mode: normMode(row[cMo]), items, amount: toNum(row[cA]), note: clean(row[cNo]) });
    }
  }
  const notesName = names.find(n => /^notes?$/i.test(n.trim())); const extra = [];
  if (notesName) for (const r of sheets[notesName] || []) { if (!r || !clean(r[0])) continue; const t = r.slice(1).map(clean).filter(Boolean).join(" — "); if (t) extra.push({ who: clean(r[0]), text: t }); }
  const m = { layout: L, articles, people, fileNotes, extra, imports, nextTx: 1, nextUid: uid, nextRef: nextRefOf(people), source: "", origB64: null, loadedAt: null, modifiedAt: null, dirty: false };
  S.m = m; people.forEach(fixSizes);
  if (!txName) people.forEach(p => { p.tx = legacyTx(p); p.tx.forEach(t => t.id = nextTx++); });
  m.nextTx = nextTx;
  return m;
}
function blankModel(){
  const sheets = { Commandes: [CATALOG.header, CATALOG.price] };
  const m = parseWorkbook(sheets);
  m.source = DEFAULT_NAME; m.loadedAt = new Date().toISOString();
  return m;
}

/* ---------- persistence (this browser only) ---------- */
let saveT = null;
function persist(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S.m)); } catch(_){} }, 300); }
function readSaved(){ try { const m = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); return m && m.people ? m : null; } catch(_){ return null; } }

/* ---------- messages ---------- */
function showMsg(html, kind, sticky){ const m = $("#msg"); m.className = "msg " + kind; m.innerHTML = html; m.hidden = false; clearTimeout(showMsg.t); if (!sticky) showMsg.t = setTimeout(()=> m.hidden = true, 6000); return m; }
function hideMsg(){ $("#msg").hidden = true; }

/* ---------- load ---------- */
function pickFile(){ $("#file").click(); }
$("#loadBtn").addEventListener("click", () => {
  if (S.m && S.m.dirty){
    const m = showMsg(`Des modifications n'ont pas été exportées. Elles seront remplacées par le nouveau fichier. <button class="btn" id="exportFirst" type="button">Exporter d'abord</button><button class="btn primary" id="loadAnyway" type="button">Charger quand même</button>`, "warn", true);
    m.querySelector("#exportFirst").onclick = () => { hideMsg(); doExport(); };
    m.querySelector("#loadAnyway").onclick = () => { hideMsg(); pickFile(); };
    return;
  }
  pickFile();
});
$("#file").addEventListener("change", e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ""; });
document.addEventListener("dragover", e => e.preventDefault());

function readFile(file){
  if (!window.XLSX){ showMsg("Le lecteur Excel n'a pas pu se charger. Vérifiez la connexion internet puis rechargez la page.", "err", true); return; }
  const fr = new FileReader();
  fr.onload = e => {
    try {

function buildWorkbook(){

    const lt = lastTx(p), dc = lt ? dtCell(lt.date, lt.time) : null;

  });
  const old = wb.Sheets[L.sheet];
  ws["!cols"] = old && old["!cols"] ? old["!cols"].slice(0, W).concat(Array(Math.max(0, W - old["!cols"].slice(0, W).length)).fill({ wch:14 })) : L.header.map((h,i) => ({ wch: i === 0 ? 26 : i === L.iNotes ? 50 : 14 }));
  setSheet(wb, L.sheet, ws);

  people.forEach(p => m.articles.filter(a => a.fam !== "autre").forEach(a => {
    const q = p.qty[a.col] || 0; if (!q) return;
    const counts = {}; (p.sizes[a.col] || []).forEach(s => { const k = noSize(a.name) ? "Taille unique" : (s || "À préciser"); counts[k] = (counts[k]||0) + 1; });
    Object.entries(counts).forEach(([k,n]) => t.push([p.name, p.cat || "", FAMS[a.fam].label, a.name, k, n, paidN(p, a.col) >= q ? "Oui" : paidN(p, a.col) > 0 ? "Partiel" : "Non"]));
  }));
  const wt = XLSX.utils.aoa_to_sheet(t); wt["!cols"] = [{wch:26},{wch:10},{wch:16},{wch:36},{wch:14},{wch:9},{wch:8}];

  // À commander
  const o = [["Famille","Article","Taille","Quantité","dont réglé","dont non réglé / non renseigné"]];
  orderRows(people).filter(fr => fr.fam !== "autre").forEach(fr => fr.rows.forEach(r => Object.entries(r.sizes).sort().forEach(([sz, v]) => o.push([FAMS[fr.fam].label, r.name, sz, v.q, v.paid, v.q - v.paid]))));
  const wo = XLSX.utils.aoa_to_sheet(o); wo["!cols"] = [{wch:16},{wch:36},{wch:14},{wch:10},{wch:11},{wch:26}];
  setSheet(wb, "À commander", wo);
  const bq = [["Adhérent","Article","Quantité","Prix unitaire (€)","Montant (€)","Pièces payées","Mode","Date"]];
  people.forEach(p => m.articles.filter(a => a.fam === "autre").forEach(a => { const q = p.qty[a.col] || 0; if (!q) return; const lt = lastDayTx(p);
    bq.push([p.name, a.name, q, a.price || null, q * a.price, paidN(p, a.col), lt ? lt.mode || null : null, lt ? [lt.date, lt.time].filter(Boolean).join(" ") || null : null]); }));
  const wbq = XLSX.utils.aoa_to_sheet(bq); wbq["!cols"] = [{wch:26},{wch:36},{wch:9},{wch:15},{wch:11},{wch:13},{wch:15},{wch:16}];
  setSheet(wb, "Boutique", wbq);
  setSheet(wb, wb.SheetNames.find(n => /^synth/i.test(n)) || "Synthèse", synthSheet(first));
  const tx = [["N°","Adhérent","E-mail","Date","Heure","Mode","Montant (€)","Type","Articles","Note"]];
  people.forEach(p => (p.tx || []).forEach(t => {
    const cols = Object.keys(t.items).filter(c => t.items[c] > 0); const arts = cols.map(c => m.articles.find(a => a.col === +c)).filter(Boolean);
    const scopes = [...new Set(arts.map(a => SCOPES[scopeOf(a.fam)].label))].join(" + ");

  }));
  tx.slice(1).sort((a,b)=>a[0]-b[0]);
  const txRows = [tx[0], ...tx.slice(1).sort((a,b)=>a[0]-b[0])];
  const wtx = XLSX.utils.aoa_to_sheet(txRows);
  txRows.slice(1).forEach((row, i) => { const dc = dtCell(row[3], null), hc = dtCell(null, row[4]);
    if (dc) wtx[XLSX.utils.encode_cell({ r: i + 1, c: 3 })] = dc; if (hc) wtx[XLSX.utils.encode_cell({ r: i + 1, c: 4 })] = hc; }); wtx["!cols"] = [{wch:5},{wch:24},{wch:26},{wch:12},{wch:7},{wch:15},{wch:11},{wch:30},{wch:70},{wch:40}];
  setSheet(wb, "Transactions", wtx);
  const im = [["Clé","Formulaire","Horodateur","E-mail","Nom (formulaire)","Adhérent","Importé le"]];
  (m.imports || []).forEach(x => im.push([x.key, x.form, x.ts, x.email, x.name, x.who, x.at]));
  const wi = XLSX.utils.aoa_to_sheet(im); wi["!cols"] = [{wch:50},{wch:22},{wch:26},{wch:30},{wch:26},{wch:26},{wch:12}];
  setSheet(wb, "Imports Google", wi);
  const info = [["Suivi des tenues — Laval Triathlon Club"], [`Fichier enregistré le ${new Date().toLocaleString("fr-FR")} par l'outil de suivi v2.`], [],
    ["Pour reprendre le travail : ouvrir l'outil, cliquer sur « Charger les données » et choisir ce fichier."],
    ["Commandes : une ligne par adhérent. Dans chaque colonne article : la taille (ex. « Homme M »), plusieurs pièces séparées par « + » (ex. « Homme M + Femme S »), « ? » pour une taille inconnue, ou simplement le nombre de pièces."],
    ["Boutique : articles vendus et remis sur place (goodies, maillot course à pied…), sans sac ni retrait."],
    ["Tailles : une ligne par article et par taille pour chaque adhérent. « À préciser » = taille manquante."],
    ["À commander : total par article et par taille, avec ce qui est déjà réglé."],
    ["Transactions : un paiement par ligne, avec les articles qu'il règle (« Article ×quantité » séparés par « ; »). Commande tenues = trifonctions + vélo ; Achats du jour = goodies, maillot course à pied…"],
    ["Imports Google : réponses de formulaires déjà importées (sert à éviter les doublons). Ne pas modifier."],
    ["Vous pouvez corriger les valeurs à la main dans Excel ; gardez les en-têtes et l'ordre des colonnes."]];
  const wl = XLSX.utils.aoa_to_sheet(info); wl["!cols"] = [{wch:110}]; setSheet(wb, "À lire", wl);
  return forceRecalc(XLSX.write(wb, { bookType:"xlsx", type:"array" }));

/* Ask Excel to recompute every formula (Synthèse sheet, totals) when the file is opened */
function forceRecalc(buf){
  try {
    const z = XLSX.CFB.read(new Uint8Array(buf), { type:"array" });
    const i = z.FullPaths.findIndex(p => /xl\/workbook\.xml$/.test(p)); if (i < 0) return buf;
    const e = z.FileIndex[i]; let x = new TextDecoder().decode(e.content);
    if (/<calcPr/.test(x)) x = x.replace(/<calcPr([^>]*?)\/>/, (m, a) => /fullCalcOnLoad/.test(a) ? m : `<calcPr${a} fullCalcOnLoad="1"/>`);
    else x = x.replace("</sheets>", '</sheets><calcPr fullCalcOnLoad="1"/>');
    e.content = new TextEncoder().encode(x); e.size = e.content.length;
    return XLSX.CFB.write(z, { type:"array", fileType:"zip", compression:true });
  } catch(_){ return buf; }
}
/* Excel expression counting pieces in cells holding a number of pieces or sizes joined by "+" */
const txtPieces = rg => `ISTEXT(${rg})*(LEN(${rg})-LEN(SUBSTITUTE(${rg},"+",""))+1)`;
const piecesSum = rg => `SUM(${rg})+SUMPRODUCT(${txtPieces(rg)})`;
function synthSheet(first){
  const m = S.m, sh = "'" + m.layout.sheet.replace(/'/g,"''") + "'", last = Math.max(first + m.people.length + 200, 1000);
  const rg = c => `${sh}!$${colL(c)}$${first+1}:$${colL(c)}$${last}`;
  const ws = XLSX.utils.aoa_to_sheet([["Synthèse des commandes"], ["Recalculée par Excel à partir de l'onglet Commandes (une taille = une pièce)."], [], ["Article", "Quantité commandée", "dont réglée (à l'enregistrement)"]]);
  const put = (r, c, cell) => ws[XLSX.utils.encode_cell({ r, c })] = cell;
  let r = 4;
  m.articles.forEach(a => {
    const st = articleStats(m.people).find(x => x.col === a.col);
    put(r, 0, { t:"s", v:a.name }); put(r, 1, { t:"n", v:st.q, f: piecesSum(rg(a.col)) }); put(r, 2, { t:"n", v:st.paid }); r++;
  });
  const tot = articleStats(m.people).reduce((s,x)=>s+x.q,0);
  put(r+1, 0, { t:"s", v:"Total des articles" }); put(r+1, 1, { t:"n", v:tot, f:`SUM(B5:B${r})` });
  const tri = m.articles.filter(a => a.fam === "tri"), catR = `${sh}!$${colL(m.layout.iCat)}$${first+1}:$${colL(m.layout.iCat)}$${last}`;
  const triJ = m.people.filter(p => norm(p.cat) === "jeune").reduce((s,p)=>s+tri.reduce((t,a)=>t+(p.qty[a.col]||0),0),0);
  put(r+2, 0, { t:"s", v:"Trifonctions jeunes à voir avec Fanny" }); put(r+2, 1, { t:"n", v:triJ, f: tri.length ? tri.map(a => `SUMIF(${catR},"Jeune",${rg(a.col)})+SUMPRODUCT((${catR}="Jeune")*${txtPieces(rg(a.col))})`).join("+") : "0" });
  put(r+3, 0, { t:"s", v:"Montant total commandé (€)" }); put(r+3, 1, { t:"n", v:agg(m.people).total, f:`SUM(${rg(m.layout.iTotal)})` });
  ws["!ref"] = XLSX.utils.encode_range({ s:{ r:0, c:0 }, e:{ r:r+3, c:2 } });
  ws["!cols"] = [{wch:44},{wch:20},{wch:30}];
  return ws;
}
function setSheet(wb, name, ws){ if (wb.SheetNames.includes(name)) wb.Sheets[name] = ws; else XLSX.utils.book_append_sheet(wb, ws, name); }
function exportName(){
  const base = (S.m.source || DEFAULT_NAME).replace(/\.(xlsx|xlsm|xls)$/i, "").replace(/\s*\(maj [^)]*\)$/i, "");
  const d = new Date(); const p2 = n => String(n).padStart(2,"0");
  return `${base} (maj ${p2(d.getDate())}-${p2(d.getMonth()+1)}-${String(d.getFullYear()).slice(2)} ${p2(d.getHours())}h${p2(d.getMinutes())}).xlsx`;

/* Saves through claude.ai when the page runs there, otherwise as a normal browser download (HTML file opened on the computer) */
async function saveFile(filename, buf){
  let dl = S.downloads;
  if (!dl && window.claude?.use){ try { dl = S.downloads = await window.claude.use("downloads"); } catch(_){} }
  if (dl){ await dl.save({ filename, data: new Blob([buf]) }); return; }
  const blob = new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename; a.style.display = "none"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function saveError(err){
  const c = err && err.code;
  if (c === "declined") showMsg("Export annulé : le fichier n'a pas été enregistré.", "warn");
  else if (c === "rate_limited") showMsg("Une fenêtre d'enregistrement est déjà ouverte. Terminez-la puis réessayez.", "warn");
  else showMsg("L'enregistrement du fichier a échoué (" + esc(c || err?.message || "erreur") + ").", "err", true);
}
async function doExport(){
  if (!S.m) return;
  let buf; try { buf = buildWorkbook(); } catch(err){ showMsg("Le fichier Excel n'a pas pu être généré : " + esc(err.message || err), "err", true); return; }
  const filename = exportName();
  try {
    await saveFile(filename, buf);
    S.m.dirty = false; persist(); renderNav(); renderHeaderState();
    showMsg(`Fichier « ${esc(filename)} » enregistré (dossier Téléchargements).`, "ok");
  } catch(err){ saveError(err); }
}

/* ---------- aggregates ---------- */
function agg(list){
  const a = { n:list.length, total:0, paid:0, unpaid:0, unknown:0, nPaid:0, nUnpaid:0, nUnknown:0, nPartial:0, qty:0 };
  list.forEach(p => { const c = calc(p); a.total += c.total; a.qty += c.qty; a.paid += c.paidAmt; const rest = c.total - c.paidAmt; if (c.st === "unknown") a.unknown += rest; else a.unpaid += rest;
    a["n" + {paid:"Paid",partial:"Partial",unpaid:"Unpaid",unknown:"Unknown"}[c.st]]++; });
  return a;
}
function articleStats(list, fam){
  return S.m.articles.filter(a => !fam || fam === "all" || a.fam === fam).map(a => {
    const s = { ...a, q:0, paid:0, unpaid:0, unknown:0, amt:0 };
    list.forEach(p => { const q = p.qty[a.col] || 0; if (!q) return; const pn = paidN(p, a.col); s.q += q; s.paid += pn; s[statusOf(p) === "unknown" ? "unknown" : "unpaid"] += q - pn; s.amt += q * a.price; });
    return s;
  });
}
function orderRows(list){
  return FAM_ORDER.map(fam => ({ fam, rows: S.m.articles.filter(a => a.fam === fam).map(a => {
    const sizes = {}; let q = 0, paid = 0;
    list.forEach(p => { const n = p.qty[a.col] || 0; if (!n) return; q += n; const pn = paidN(p, a.col); paid += pn;
      (p.sizes[a.col] || []).forEach((s, i) => { const k = noSize(a.name) ? "Taille unique" : (s || "À préciser"); sizes[k] = sizes[k] || { q:0, paid:0 }; sizes[k].q++; if (i < pn) sizes[k].paid++; }); });
    return { name:a.name, col:a.col, price:a.price, q, paid, sizes };
  }) }));
}

function sizeOrder(s){ if (s === "À préciser") return 999; if (s === "Taille unique") return 500; const [g, z] = s.split(" "); const gi = g === "Homme" ? 0 : g === "Femme" ? 100 : g === "Unisexe" ? 200 : 300; const zi = (SIZE_LIST.indexOf((z || "").toUpperCase()) + 1) || 50; return gi + zi + (/\(/.test(s) ? 0.5 : 0); }

    const q = sizes.reduce((s,x)=>s+x[1],0); if (q) arts.push({ fam:f.fam, name:r.name, q, sizes }); }));
  return { arts, total: arts.reduce((s,a)=>s+a.q,0), todo: arts.reduce((s,a)=>s+a.sizes.filter(x=>x[0]==="À préciser").reduce((t,x)=>t+x[1],0),0) };

const FORMS = { tri:{ label:"Formulaire trifonction", short:"Form. tri", fam:"tri" }, velo:{ label:"Formulaire tenue vélo", short:"Form. vélo", fam:"velo" } };
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || ""; const delim = (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim){ row.push(f); f = ""; }
    else if (c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}
const words = s => norm(s).split(/[^a-z0-9]+/).filter(w => w.length >= 4);
const GENERIC = new Set(["souhaite","taille","mixte","unisexe","femme","homme","tenue"]);
function matchArticle(header, fam){
  const hw = new Set(words(header)); const hg = hw.has("femme") ? "femme" : hw.has("homme") ? "homme" : null;
  let best = null, bs = 0;
  S.m.articles.filter(a => a.fam === fam).forEach(a => {
    const aw = words(a.name); const ag = aw.includes("femme") ? "femme" : aw.includes("homme") ? "homme" : null;
    if (ag && ag !== hg) return;
    const shared = aw.filter(w => hw.has(w)); if (!shared.some(w => !GENERIC.has(w))) return;
    if (shared.length > bs){ bs = shared.length; best = a; }
  });
  return best;
}
function sizeLabel(a, value, gender){
  const v = clean(value); if (!v || /^(oui|x|yes|1)$/i.test(v)) return noSize(a.name) ? "Taille unique" : "";
  if (noSize(a.name)) return "Taille unique";
  if (/^(homme|femme|unisexe)\b/i.test(v)) return title(v.split(" ")[0]) + " " + v.split(" ").slice(1).join(" ").toUpperCase();
  const n = norm(a.name); const g = gender || (/\bfemme\b/.test(n) ? "Femme" : /\bhomme\b/.test(n) ? "Homme" : "Unisexe");
  return g + " " + normSize(v);
}
const NO_VAL = /^(non|no|aucun|aucune|-|0|pas besoin|rien)$/i;
function parseForm(rows, form){
  if (rows.length < 1) throw new Error("Le fichier est vide.");
  const head = rows[0].map(h => clean(h)); const H = head.map(norm);
  const idx = re => H.findIndex(h => re.test(h));
  const body0 = rows.slice(1);
  const iTs = idx(/horodat|timestamp/);
  let iMail = -1, bestAt = 0;
  head.forEach((h, ci) => { if (ci === iTs) return; const n = body0.filter(r => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean(r[ci]))).length; if (n > bestAt){ bestAt = n; iMail = ci; } });
  if (bestAt < Math.max(1, Math.ceil(body0.length / 2))) iMail = idx(/mail/);
  let iName = H.findIndex((h, ci) => ci !== iMail && ci !== iTs && /prenom/.test(h));
  if (iName < 0) iName = H.findIndex((h, ci) => ci !== iMail && ci !== iTs && /^nom\b|^name/.test(h) && !/utilisateur|user/.test(h));
  if (iName < 0) throw new Error("Colonne « NOM Prénom » introuvable.");
  const used = new Set([iTs, iMail, iName].filter(i => i >= 0));
  const body = rows.slice(1); let map = [], tri = null; const warns = [];
  if (form === "velo"){
    H.forEach((h, ci) => { if (used.has(ci)) return; const a = matchArticle(head[ci], "velo"); if (a){ map.push({ ci, a }); used.add(ci); } });
    if (!map.length) throw new Error("Aucune colonne d'article vélo reconnue. Vérifiez que c'est bien l'export du formulaire tenue vélo.");
    map.forEach(m => warns.push(`« ${head[m.ci]} » → ${m.a.name}`));
  } else {
    const colWith = re => head.findIndex((h, ci) => !used.has(ci) && body.some(r => re.test(clean(r[ci]))));
    const gC = colWith(/^(homme|femme)$/i); if (gC >= 0) used.add(gC);
    const tC = colWith(/courte|longue/i); if (tC >= 0) used.add(tC);
    const sC = H.findIndex((h, ci) => !used.has(ci) && /taille/.test(h)); if (sC >= 0) used.add(sC);
    const courte = S.m.articles.find(a => a.fam === "tri" && /courte/.test(norm(a.name))), longue = S.m.articles.find(a => a.fam === "tri" && /longue/.test(norm(a.name)));
    if (tC < 0) throw new Error("Colonne « courte / longue distance » introuvable. Vérifiez que c'est bien l'export du formulaire trifonction.");
    if (!courte || !longue) throw new Error("Les articles « Trifonction courte distance » et « Trifonction longue distance » sont absents du fichier de commandes.");
    tri = { gC, tC, sC, courte, longue };
    warns.push(`Genre : « ${gC >= 0 ? head[gC] : "non trouvé"} » · Modèle : « ${head[tC]} » · Taille : « ${sC >= 0 ? head[sC] : "non trouvée"} »`);
  }
  const restCols = head.map((h, ci) => ci).filter(ci => !used.has(ci));
  const remCols = restCols.filter(ci => /doute|remarq|reamrq|comment|question|precision/.test(H[ci])), ignCols = restCols.filter(ci => !remCols.includes(ci));
  if (remCols.length) warns.push("Lu comme remarques : " + remCols.map(ci => `« ${head[ci]} »`).join(", "));
  if (ignCols.length) warns.push("Ignoré : " + ignCols.map(ci => `« ${head[ci]} »`).join(", "));
  const out = [];
  body.forEach((r, ri) => {
    const name = clean(r[iName]), email = iMail >= 0 ? clean(r[iMail]) : "", ts = iTs >= 0 ? clean(r[iTs]) : "ligne " + (ri + 2);
    if (!name && !email) return;
    const items = [];
    if (form === "velo") map.forEach(({ ci, a }) => { const v = clean(r[ci]); if (!v || NO_VAL.test(v)) return; items.push({ col:a.col, art:a.name, size:sizeLabel(a, v) }); });
    else { const tv = clean(r[tri.tC]); if (tv){ const a = /longue/i.test(tv) ? tri.longue : tri.courte; const g = tri.gC >= 0 ? title(clean(r[tri.gC])) : ""; const sz = tri.sC >= 0 ? clean(r[tri.sC]) : "";
      const variant = clean(tv.split(",").slice(1).join(",")); let size = sz ? (g || "Unisexe") + " " + normSize(sz) : ""; if (size && variant) size += " (" + variant.toLowerCase() + ")";
      items.push({ col:a.col, art:a.name, size }); } }
    const remarks = remCols.map(ci => [head[ci], clean(r[ci])]).filter(x => x[1]).map(([h, v]) => `${h.replace(/\s+/g," ").trim()} : ${v}`);
    out.push({ form, ts, email, name: title(name), formName: name, remarks, items, key: [form, ts, norm(email), norm(name)].join("|") });
  });
  return { out, warns };
}
const mtok = s => norm(s).split(/[\s\-'’.]+/).filter(t => t.length > 1);
function lev(a, b){ const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[a.length][b.length]; }
/* distance between two names (any word order, small spelling gaps); null = different people */
function nameDist(a, b){
  if (a.length < 2 || b.length < 2) return null;
  const [s, l] = a.length <= b.length ? [a, b] : [b, a]; const used = new Set(); let total = 0, exact = 0;
  for (const tk of s){ let bi = -1, bd = 99; l.forEach((u, i) => { if (used.has(i)) return; const d = lev(tk, u); if (d < bd){ bd = d; bi = i; } });
    if (bi < 0 || bd > (tk.length >= 5 ? 2 : 1)) return null; used.add(bi); total += bd; if (!bd) exact++; }
  const longOnly = s.every(tk => tk.length >= 5);
  return exact || (longOnly && total <= 2) ? total + (l.length - s.length) * 0.5 : null;
}
function findMatch(r){
  const rt = mtok(r.name); let best = null, bd = 99;
  S.m.people.forEach(p => { const d = nameDist(rt, mtok(p.name)); if (d !== null && d < bd){ bd = d; best = p; } });
  if (best){ r.how = bd === 0 ? "même nom" : "nom proche : vérifiez"; return best.uid; }
  if (r.email){ const c = S.m.people.filter(p => p.email && norm(p.email) === norm(r.email));
    if (c.length === 1 && rt.some(tk => mtok(c[0].name).some(u => lev(tk, u) <= 1))){ r.how = "même e-mail"; return c[0].uid; } }
  r.how = ""; return "new";
}
const newKey = r => "n:" + mtok(r.name).sort().join(" ");
let stageId = 1;
function loadFormCSV(file, form){
  if (!S.m){ showMsg("Chargez d'abord votre fichier Excel (ou démarrez un fichier vide) avant d'importer un formulaire.", "warn", true); return; }
  const fr = new FileReader();
  fr.onload = e => {
    try {
      const { out, warns } = parseForm(parseCSV(String(e.target.result)), form);
      const done = new Set((S.m.imports || []).map(x => x.key));
      S.stage.rows = S.stage.rows.filter(r => r.form !== form); S.stage.ignored = S.stage.ignored.filter(r => r.form !== form);
      out.forEach(r => {
        if (done.has(r.key)){ S.stage.ignored.push(r); return; }
        r.id = stageId++; r.removed = false; r.cat = ""; r.target = findMatch(r); r.items.forEach(it => { it.id = stageId++; it.removed = false; });
        S.stage.rows.push(r);
      });
      S.stage.files[form] = { name: file.name, n: out.length, warns };
      render();
      const ign = S.stage.ignored.filter(r => r.form === form).length;
      showMsg(`${esc(file.name)} : ${plural(out.length, "réponse")} lue${out.length>1?"s":""}${ign ? `, dont ${ign} déjà importée${ign>1?"s":""} (ignorée${ign>1?"s":""})` : ""}. Vérifiez puis cliquez sur « Valider l'import ».`, "ok");
    } catch(err){ showMsg(esc(file.name) + " : " + esc(err.message || err), "err", true); }
  };
  fr.readAsText(file, "utf-8");
}
/* one import step on a {qty, sizes} record; returns what happened */
function importStep(st, it){
  const q = st.qty[it.col] || 0; const arr = (st.sizes[it.col] || []).slice(0, q); while (arr.length < q) arr.push(""); st.sizes[it.col] = arr;
  if (it.size){ const e = arr.indexOf(""); if (e >= 0){ arr[e] = it.size; return "fill"; } if (arr.includes(it.size)) return "dup"; }
  else if (q > 0) return "dup";
  arr.push(it.size || ""); st.qty[it.col] = q + 1; return "add";
}
function simulate(){
  const state = new Map();
  S.stage.rows.forEach(r => {
    if (r.removed){ r.items.forEach(it => it.action = null); return; }
    const k = r.target === "new" ? "new:" + newKey(r) : "p:" + r.target;
    if (!state.has(k)){ const p = r.target === "new" ? null : person(+r.target); state.set(k, { qty: { ...(p ? p.qty : {}) }, sizes: JSON.parse(JSON.stringify(p ? p.sizes : {})), had: { ...(p ? p.qty : {}) } }); }
    const st = state.get(k);
    r.items.forEach(it => { if (it.removed){ it.action = null; return; } it.had = st.qty[it.col] || 0; it.action = importStep(st, it); });
  });
}
function applyImport(){

    let p;

      if (!p){ p = { uid: S.m.nextUid++, name: r.name, cat: r.cat, qty:{}, sizes:{}, paid:"Non", mode:"", time:"", note:"", form:"Oui", cells:[], tx:[], prep:false, ref:"", ret:false, retDate:"", retNote:"", email: r.email, origin: FORMS[r.form].label };
        S.m.people.push(p); made.set(k, p); nNew++; } }
